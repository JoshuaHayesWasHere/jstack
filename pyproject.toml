[project]
name = "jstack"
version = "0.1.0"
description = "jstack's seven commands. jgauge: what a thread cost in tokens. jbriefs: one page of every home. jmerge: merge what is ready. jbus: a home's routine work, on a timer and with no model. jdrift: what changed upstream in pstack since the pin. jroles: the model each role's thread is launched on. jleak: what must not leave the machine for a public repo, found before a push or a pull request."
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tzdata>=2026.5",
]

[project.scripts]
jgauge = "jgauge.cli:main"
jbriefs = "jbriefs.cli:main"
jmerge = "jmerge.cli:main"
jbus = "jbus.cli:main"
jdrift = "jdrift.cli:main"
jroles = "jroles.cli:main"
jleak = "jleak.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jgauge", "src/jbriefs", "src/jmerge", "src/jbus", "src/jdrift", "src/jroles", "src/jleak", "src/jsettings"]

# The repo's test command is `uv run pytest`, which runs the tests one after another.
# `make check` runs it with `-n`, on the workers the Makefile counts.
[tool.pytest.ini_options]
testpaths = ["tests"]
# A run writes about 170,000 files under the temporary directory, and by default pytest
# keeps the last three runs. `/tmp` holds a million files and is shared by every runner and
# crew. With "failed" a test's directory goes as soon as the test passes, so a run in which
# the tests pass never holds more than its workers' tests at once; "none" would keep them all
# until the run ends. A test that fails keeps its directory, and only the last run's are kept.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
# Each test has its own bound (pytest-timeout): one that waits on a browser, a server or a
# subprocess that never answers fails with its name after this many seconds, and the run goes
# on. Without it a hang ran until the job's limit and the log said nothing of which test.
timeout = 120

# The repo's lint commands are `uv run ruff check .` and `uv run ruff format --check .`.
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF100", "PGH004"]
