[project]
name = "jstack"
version = "0.1.0"
description = "jstack's eight commands. jgauge: what a thread cost in tokens. jbriefs: one page of every home. jmerge: merge what is ready. jbus: a home's routine work, on a timer and with no model. jdrift: what changed upstream in pstack since the pin. jroles: the model each role's thread is launched on. jleak: what must not leave the machine for a public repo, found before a push or a pull request. jpack: a context pack's notes linted, their citations verified, and the stale ones listed."
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tzdata>=2026.5",
]

[project.scripts]
# generated: scripts by scripts/generate-jstack-trees.py from features/*/feature.json; edit those, then rerun
jbriefs = "jbriefs.cli:main"
jbus = "jbus.cli:main"
jdrift = "jdrift.cli:main"
jgauge = "jgauge.cli:main"
jinstall = "jinstall.cli:main"
jleak = "jleak.cli:main"
jmerge = "jmerge.cli:main"
jpack = "jpack.cli:main"
jroles = "jroles.cli:main"
# end generated

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
exclude = ["/share/jstack/**/src/", "/share/jstack/**/tests/", "/share/jstack/**/evals/"]
# generated: packages by scripts/generate-jstack-trees.py from features/*/feature.json; edit those, then rerun
packages = ["features/jdrift/src/jdrift", "features/jsettings/src/jsettings", "src/jbriefs", "src/jbus", "src/jgauge", "src/jinstall", "src/jleak", "src/jmerge", "src/jpack", "src/jroles"]
# end generated

# The source tree, as the wheel's shared data: installed at <venv>/share/jstack, so a release runs
# with no checkout. `jbriefs.skills` reads its skills.json there, and `jinstall` assembles each
# harness's layout from it. A feature's code and tests are not shared data: `exclude` names them
# by where the wheel puts them.
[tool.hatch.build.targets.wheel.shared-data]
# generated: source by scripts/generate-jstack-trees.py from features/*/feature.json; edit those, then rerun
"skills.json" = "share/jstack/skills.json"
"plugin.json" = "share/jstack/plugin.json"
"docs" = "share/jstack/docs"
"features" = "share/jstack/features"
"hooks" = "share/jstack/hooks"
"playbooks" = "share/jstack/playbooks"
"principles" = "share/jstack/principles"
"skills" = "share/jstack/skills"
"templates" = "share/jstack/templates"
# end generated

# The repo's test command is `uv run pytest`, which runs the tests one after another.
# `make check` runs it with `-n`, on the workers the Makefile counts.
[tool.pytest.ini_options]
# generated: paths by scripts/generate-jstack-trees.py from features/*/feature.json; edit those, then rerun
testpaths = ["tests", "features/jdrift/tests", "features/jsettings/tests", "features/pr-review/tests", "features/show-me-your-work/tests"]
pythonpath = ["features/jdrift/src", "features/jsettings/src", "src", "tests", "features/jdrift/tests", "features/jsettings/tests", "features/pr-review/tests", "features/show-me-your-work/tests"]
# end generated
# A run writes about 170,000 files under the temporary directory, and by default pytest
# keeps the last three runs. `/tmp` holds a million files and is shared by every runner and
# crew. With "failed" a test's directory goes as soon as the test passes, so a run in which
# the tests pass never holds more than its workers' tests at once; "none" would keep them all
# until the run ends. A test that fails keeps its directory, and only the last run's are kept.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
# Each test has its own bound (pytest-timeout): one that waits on a browser, a server or a
# subprocess that never answers fails with its name after this many seconds, and the run goes
# on. Without it a hang ran until the job's limit and the log said nothing of which test.
timeout = 120
# A test that opens a real browser carries `browser`. `make check` leaves those out and
# `make check-browser` runs only them: they take minutes, hold the machine's browser lock,
# and run nightly and on a release (.github/workflows/browser.yml), not for every change.
# With --strict-markers a marker that is not listed here is an error, not a typo that passes.
addopts = "--strict-markers"
markers = [
    "browser: opens a real browser, so it runs under `make check-browser` and not under `make check`",
]

# The repo's lint commands are `uv run ruff check .` and `uv run ruff format --check .`.
[tool.ruff]
target-version = "py312"
line-length = 100
# generated: ruff by scripts/generate-jstack-trees.py from features/*/feature.json; edit those, then rerun
src = ["features/jdrift/src", "features/jsettings/src", "src", "tests", "features/jdrift/tests", "features/jsettings/tests", "features/pr-review/tests", "features/show-me-your-work/tests"]
# end generated

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF100", "PGH004"]

# `testing/`, the tests' shared plumbing, is a package at the root, imported beside the tests' own.
[tool.ruff.lint.isort]
known-first-party = ["testing"]
