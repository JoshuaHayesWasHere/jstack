name: release

# A release, cut by a pushed `v*` tag and by nothing else: `make release` on a clean main
# pushes the tag `v<version>`. The tag must be pyproject.toml's version and plugin.json's,
# its tree must have passed the whole suite, which this workflow starts where no run left the
# marker, and the wheel must install with no checkout and check ok in a HOME of its own before
# the release is made. Its assets are what `make dist` writes:
# the wheel, the sdist, and install.sh with that version written in, which a user fetches as
# `curl -fsSL .../releases/latest/download/install.sh | sh`.
on:
  push:
    tags: ['v*']

# Making the release writes to the repo: nothing else does. `make release-green` reads the
# check's artifacts and runs, and starts check.yml's full run on the tag (`actions: write`).
permissions:
  contents: write
  actions: write

env:
  # The uv every setup-uv step installs: with none setup-uv fetches the latest release on
  # each job. check.yml, browser.yml, pstack-drift.yml and release.yml name the same one
  # (testing/tests/test_workflows.py).
  UV_VERSION: "0.13.2"

jobs:
  release:
    # GitHub's hosted runner, as in check.yml. It runs no suite itself: check.yml's full run
    # passes the tag's tree, and this job builds, installs and publishes. The cap holds the wait
    # for that run, `make release-green`'s hour, and the rest.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: make release-tag
        env:
          TAG: ${{ github.ref_name }}
        run: make release-tag TAG="$TAG"
      # The whole suite on this tree: a green full run of check.yml left the marker
      # `green-tree-<tree>` for it, which `make release-green` asks for through
      # jmerge.green.green_run. Where none did, it starts check.yml's full run on the tag, a
      # manual run, which always runs the suite, waits for it and asks again. A red run fails
      # it, naming the run, and nothing is published.
      - name: make release-green
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: make release-green
      - name: make dist
        run: make dist
      - name: jinstall --check
        # The wheel as a user with no checkout installs it: a tool directory, a bin directory
        # and a HOME of their own, outside the checkout.
        run: |
          sandbox=$(mktemp -d)
          mkdir "$sandbox/home"
          export UV_TOOL_DIR="$sandbox/tools" UV_TOOL_BIN_DIR="$sandbox/bin"
          uv tool install dist/*.whl
          cd "$sandbox/home"
          HOME="$sandbox/home" PATH="$sandbox/bin:$PATH" "$sandbox/bin/jinstall"
          HOME="$sandbox/home" PATH="$sandbox/bin:$PATH" "$sandbox/bin/jinstall" --check
      - name: gh release create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        # Quoted whole: unquoted, the `: ` in the notes is a YAML error, and GitHub fails the
        # file on every push (testing/tests/test_workflows.py).
        run: 'gh release create "$TAG" dist/* --verify-tag --title "jstack $TAG" --notes "Install: curl -fsSL https://github.com/$REPO/releases/latest/download/install.sh | sh"'
