name: browser

# The tests marked `browser` open a real browser and take minutes, so no change's check runs
# them (check.yml leaves them out). They run here on four triggers and no other: a nightly
# at 03:00 ET (07:00 UTC), a release (a pushed `v*` tag, or a published GitHub release), by
# hand, and a pull request into main that changes the view or its browser tests. Never on a
# push to main.
#
# The pull request trigger has check.yml's `types`, and the job's `if` skips a draft as
# check.yml's jobs do, so a pull request runs it once it is marked ready. #464 merged with 19
# of these tests red, as no pull request ran them. The run is no required check: a merge does
# not wait on it.
#
# A red run is not told from here: jbus reads this workflow's runs and files and queues the
# brief for the fix, `browser-red-<date>` (features/jbus/src/jbus/watch.py). It skips a manual
# run off main, and no other, so a pull request's red run is filed too.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['features/jbus/src/jbus/view/**', 'features/jbus/tests/view/**']
  schedule:
    - cron: '0 7 * * *'
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The uv every setup-uv step installs: with none setup-uv fetches the latest release on
  # each job. check.yml, browser.yml and pstack-drift.yml name the same one
  # (testing/tests/test_workflows.py).
  UV_VERSION: "0.13.2"

jobs:
  browser:
    # GitHub's hosted runner, as in check.yml. The 94 browser tests run one at a time, and
    # the job took 4 and 6 minutes on two runs of 2026-10-22: 15 leaves room for a slow
    # runner, and a hung run still stops.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The stable Google Chrome that GitHub's image installs. A Chromium snapshot's virtual
      # time now and then never starts, and the browser tests then wait out their bound.
      JSTACK_TEST_BROWSER: /usr/bin/google-chrome
      # Where the view's shot test writes each shot as this runner drew it.
      JSTACK_SHOTS_OUT: /tmp/jbus-view-shots
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      # Fails if uv.lock does not match pyproject.toml, so CI runs the locked versions.
      - run: uv sync --locked
      # The browser is declared, not assumed: a runner without it fails here with one error
      # naming the path, before the tests, and not as one failure for each browser test.
      - name: test browser
        run: test -x "$JSTACK_TEST_BROWSER" || { echo "::error::no test browser at $JSTACK_TEST_BROWSER, which the browser run declares"; exit 1; }
      - name: make check-browser
        run: make check-browser
      # The view's shots as this runner drew them (test_view_page_look.py), to keep in place
      # of the kept ones when the browser that draws them moved.
      - name: the view's shots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jbus-view-shots
          path: /tmp/jbus-view-shots
          if-no-files-found: ignore
