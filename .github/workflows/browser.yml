name: browser

# The tests marked `browser` open a real browser and take minutes, so no change's check runs
# them (check.yml leaves them out). They run here on four triggers and no other: a nightly
# at 03:00 ET (07:00 UTC), a release (a pushed `v*` tag, or a published GitHub release), by
# hand, and a pull request into main that changes the view, its browser tests, their kept
# shots or this workflow. Never on a push to main.
#
# The pull request trigger has check.yml's `types`, and the job's `if` skips a draft as
# check.yml's jobs do, so a pull request runs it once it is marked ready. #464 merged with 19
# of these tests red, as no pull request ran them. The run is no required check: a merge does
# not wait on it.
#
# A red run is not told from here: jbus reads this workflow's runs and files and queues the
# brief for the fix, `browser-red-<date>` (features/jbus/src/jbus/watch.py). It skips a manual
# run off main, and no other, so a pull request's red run is filed too.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['features/jbus/src/jbus/view/**', 'features/jbus/tests/view/**', 'features/jbus/tests/fixtures/jbus-view/**', '.github/workflows/browser.yml']
  schedule:
    - cron: '0 7 * * *'
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The uv every setup-uv step installs: with none setup-uv fetches the latest release on
  # each job. check.yml, browser.yml and pstack-drift.yml name the same one
  # (testing/tests/test_workflows.py).
  UV_VERSION: "0.13.2"
  # The one browser that draws the view's shots: a Chrome for Testing build, and the SHA-256 of
  # its linux64 zip. The image's own Chrome moves when GitHub rolls the image, from one runner
  # to the next over days: on 2026-10-27 one run drew with 155 and the next with 156, and the
  # shot test failed every shot on whichever was not `browser.txt`'s. To bump it, take a
  # version from googlechromelabs.github.io/chrome-for-testing, put it here with the sha256sum
  # of its chrome-linux64.zip, and keep the shots of this run's `jbus-view-shots` artifact
  # in features/jbus/tests/fixtures/jbus-view/shots/ (testing/tests/test_workflows.py).
  CHROME_VERSION: "156.0.8078.47"
  CHROME_SHA256: e6c94490f0b6b337225aeb2d2a5034858516b7017356980ba94f5176d8774a50

jobs:
  browser:
    # GitHub's hosted runner, as in check.yml. The 94 browser tests run one at a time, and
    # the job took 4 and 6 minutes on two runs of 2026-10-22: 15 leaves room for a slow
    # runner, and a hung run still stops.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The pinned Chrome for Testing build, which the step `chrome for testing` unpacks here.
      # A Chromium snapshot's virtual time now and then never starts, and the browser tests
      # then wait out their bound: a Chrome build, not a snapshot, is what this names.
      JSTACK_TEST_BROWSER: /tmp/chrome-for-testing/chrome-linux64/chrome
      # Where the view's shot test writes each shot as this runner drew it.
      JSTACK_SHOTS_OUT: /tmp/jbus-view-shots
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      # Fails if uv.lock does not match pyproject.toml, so CI runs the locked versions.
      - run: uv sync --locked
      # The pinned build, fetched from Google's own bucket, unpacked only when its zip is the
      # one CHROME_SHA256 names. Its libraries are the image's, which installs a Chrome too.
      - name: chrome for testing
        run: 'cd "$RUNNER_TEMP" && echo "$CHROME_SHA256  chrome-linux64.zip" > chrome.sha256 && curl -fsSL --retry 3 -o chrome-linux64.zip "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-linux64.zip" && sha256sum -c chrome.sha256 && unzip -q chrome-linux64.zip -d "${JSTACK_TEST_BROWSER%/chrome-linux64/chrome}" && "$JSTACK_TEST_BROWSER" --version'
      # The browser is declared, not assumed: a runner without it fails here with one error
      # naming the path, before the tests, and not as one failure for each browser test.
      - name: test browser
        run: test -x "$JSTACK_TEST_BROWSER" || { echo "::error::no test browser at $JSTACK_TEST_BROWSER, which the browser run declares"; exit 1; }
      - name: make check-browser
        run: make check-browser
      # The view's shots as this runner drew them (test_view_page_look.py), to keep in place
      # of the kept ones when the browser that draws them moved.
      - name: the view's shots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jbus-view-shots
          path: /tmp/jbus-view-shots
          if-no-files-found: ignore
