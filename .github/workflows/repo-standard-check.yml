# The shared check of the repo standard (features/repo-standard/docs/check-workflow.md). A repo
# calls it from its own .github/workflows/check.yml at the tag of the version it pins, and that
# caller's job `check` gathers it into the one check jmerge and the ruleset wait on. It takes the
# repo-standard and jmerge code it runs from jstack at the tag `.repo-standard.yml` pins, or at
# the ref `ref` names, in the runner's python3, before any setup. A repo with no `.repo-standard.yml` yet runs its check
# command alone. The file stays in the YAML subset `repo_standard.config` reads, so its test reads
# it with the standard's own reader: no block scalar, no flow map.
name: repo-standard check

on:
  workflow_call:
    inputs:
      runner:
        description: The label of the runner every job runs on, such as one on the repo's own machines.
        type: string
        default: ubuntu-24.04
      command:
        description: The repo's check command, which runs alone while the repo has no .repo-standard.yml.
        type: string
        default: ""
      timeout-minutes:
        description: The cap of each part of the tests, of the browser tests, and of the check command.
        type: number
        default: 30
      browser-channel:
        description: A browser the runner has, such as chrome, for the browser tests to run in, in place of the Playwright image of the version the e2e lockfile pins. The tests read it as $REPO_STANDARD_BROWSER_CHANNEL.
        type: string
        default: ""
      ref:
        description: The ref of jstack the jobs and the repo's make take the standard's code from, such as a branch of a version not yet tagged, named as well in the caller's uses line. Empty takes repo-standard-v<N>, the tag of the version .repo-standard.yml pins.
        type: string
        default: ""
    outputs:
      runner:
        description: The runner input, for the caller's job check to run on the same label.
        value: ${{ inputs.runner }}

permissions:
  contents: read
  actions: read

# bash with pipefail, so a step that pipes into tee fails when its command does.
defaults:
  run:
    shell: bash

env:
  REPO_STANDARD_UPSTREAM: https://github.com/JoshuaHayesWasHere/jstack
  # The version this file is: a repo whose .repo-standard.yml pins another fails the plan, since
  # the jobs here and the code they run come from one version.
  REPO_STANDARD_VERSION: 1
  # The ref the plan and the lint clone, and the skeleton's Makefile clones into .cache/: empty
  # takes the tag of the version the repo pins.
  REPO_STANDARD_REF: ${{ inputs.ref }}

jobs:
  # What the run tests, asked once: the version the repo pins, whether a passed check of the same
  # two trees is reused, the tree's marker, the selection `make select` prints for a pull request,
  # the parts it is dealt to, and the browser ids and Playwright version of the browser job
  # (`repo-standard plan`). The other jobs read its outputs.
  plan:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.standard.outputs.mode }}
      ref: ${{ steps.standard.outputs.ref }}
      run: ${{ steps.plan.outputs.run }}
      selection: ${{ steps.plan.outputs.selection }}
      shards: ${{ steps.plan.outputs.shards }}
      parts: ${{ steps.plan.outputs.parts }}
      browser: ${{ steps.plan.outputs.browser }}
      browser-ids: ${{ steps.plan.outputs.browser-ids }}
      playwright: ${{ steps.plan.outputs.playwright }}
      reused: ${{ steps.reuse.outputs.reused }}
      checked: ${{ steps.reuse.outputs.name }}
      tree: ${{ steps.tree.outputs.name }}
      marker: ${{ steps.green.outputs.marker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: standard
        id: standard
        run: 'if [ ! -f .repo-standard.yml ]; then echo "mode=command" >> "$GITHUB_OUTPUT"; echo "no .repo-standard.yml, so the check runs the repo''s check command"; exit 0; fi; N=$(sed -n "s/^standard:[[:space:]]*\([0-9][0-9]*\)[[:space:]]*\(#.*\)\{0,1\}$/\1/p" .repo-standard.yml); [ -n "$N" ] || { echo "::error::.repo-standard.yml pins no version: give it a line standard: <N>"; exit 1; }; [ "$N" = "$REPO_STANDARD_VERSION" ] || { echo "::error::.repo-standard.yml pins v$N, and check.yml calls the shared check at repo-standard-v$REPO_STANDARD_VERSION: move both to one version"; exit 1; }; REF=${REPO_STANDARD_REF:-repo-standard-v$N}; git clone -q --depth 1 --branch "$REF" "$REPO_STANDARD_UPSTREAM" "$RUNNER_TEMP/repo-standard" && printf "mode=standard\nref=%s\n" "$REF" >> "$GITHUB_OUTPUT"'
      - name: reuse
        id: reuse
        if: steps.standard.outputs.mode == 'standard' && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH="$RUNNER_TEMP/repo-standard/features/jmerge/src" python3 -m jmerge.reuse
      - name: tree
        id: tree
        if: steps.standard.outputs.mode == 'standard'
        run: echo "name=green-tree-$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      # A push to main and a manual run skip the suite on a tree a green run already passed. A
      # nightly run always runs it, and a lookup that fails runs it too.
      - name: green tree
        id: green
        if: steps.standard.outputs.mode == 'standard' && github.event_name != 'pull_request' && github.event_name != 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/repo-standard/scripts/green_tree.py"
      - name: select
        if: steps.standard.outputs.mode == 'standard' && github.event_name == 'pull_request' && steps.reuse.outputs.reused != 'true'
        run: make -s select BASE=HEAD^1 > "$RUNNER_TEMP/selection.txt" && cat "$RUNNER_TEMP/selection.txt"
      # Each test a ledger of main's runs of the last 30 days names, that no later green run of
      # main passed and whose path is still here, joins the selection (`repo-standard misses
      # failing`). A lookup that fails warns and adds nothing.
      - name: failed on main
        if: steps.standard.outputs.mode == 'standard' && github.event_name == 'pull_request' && steps.reuse.outputs.reused != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH="$RUNNER_TEMP/repo-standard/features/repo-standard/src" python3 -m repo_standard misses failing --days 30 > "$RUNNER_TEMP/failing.txt" && cat "$RUNNER_TEMP/failing.txt" | tee -a "$RUNNER_TEMP/selection.txt"
      - name: plan
        id: plan
        if: steps.standard.outputs.mode == 'standard'
        run: 'if [ -f "$RUNNER_TEMP/selection.txt" ]; then set -- --selection "$RUNNER_TEMP/selection.txt"; fi; PYTHONPATH="$RUNNER_TEMP/repo-standard/features/repo-standard/src" python3 -m repo_standard plan "$@" | tee -a "$GITHUB_OUTPUT"'
  # The lint of the tree and the standard's conformance, at the ref the plan cloned. It needs no
  # selection, so it runs beside the tests, on a reuse too.
  lint:
    needs: plan
    if: needs.plan.outputs.mode == 'standard' && needs.plan.outputs.run == 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: setup
        if: hashFiles('.github/actions/setup/action.yml') != ''
        uses: ./.github/actions/setup
      - name: make lint
        run: make lint BASE=HEAD^1
      - name: repo-standard conform
        env:
          REF: ${{ needs.plan.outputs.ref }}
        run: git clone -q --depth 1 --branch "$REF" "$REPO_STANDARD_UPSTREAM" "$RUNNER_TEMP/repo-standard" && PYTHONPATH="$RUNNER_TEMP/repo-standard/features/repo-standard/src" python3 -m repo_standard conform
  # The tests, in the parts `check.shards` sets, each with what `plan` dealt it. A reuse of a
  # passed pair of trees, and a tree a green run already passed, run none. Each part writes the ids
  # that failed to failed.txt ($REPO_STANDARD_FAILED), and on a push to the default branch runs
  # them once more, writing those that failed again to again.txt. The folder is uploaded as
  # failed-<run id>-<part> whatever the part ended, so a part run again replaces what it said.
  test:
    needs: plan
    if: needs.plan.outputs.mode == 'standard' && needs.plan.outputs.run == 'true' && needs.plan.outputs.reused != 'true' && needs.plan.outputs.marker != 'green'
    name: test ${{ matrix.shard }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup
        if: hashFiles('.github/actions/setup/action.yml') != ''
        uses: ./.github/actions/setup
      - name: make test
        id: test
        env:
          REPO_STANDARD_PART: ${{ fromJSON(needs.plan.outputs.parts)[format('{0}', matrix.shard)] }}
          REPO_STANDARD_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: 'export REPO_STANDARD_FAILED="$RUNNER_TEMP/failed/failed.txt"; mkdir -p "$RUNNER_TEMP/failed" && : > "$REPO_STANDARD_FAILED"; case $REPO_STANDARD_PART in none) echo "the selection dealt this part no test";; all) if [ "${REPO_STANDARD_SHARD#*/}" = 1 ]; then make test; else make test SHARD="$REPO_STANDARD_SHARD"; fi;; *) make test TESTS="$REPO_STANDARD_PART";; esac'
      - name: again
        if: failure() && steps.test.outcome == 'failure' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        run: 'ids=$(sort -u "$RUNNER_TEMP/failed/failed.txt" | tr "\n" " "); if [ -z "$ids" ]; then echo "the part failed and named no test to run again"; exit 0; fi; export REPO_STANDARD_FAILED="$RUNNER_TEMP/failed/again.txt"; : > "$REPO_STANDARD_FAILED"; make test TESTS="$ids" || true'
      - name: failed tests
        if: failure() && steps.test.outcome == 'failure'
        env:
          PART: ${{ matrix.shard }}
        run: '{ echo "### The tests part $PART failed"; echo; if [ -s "$RUNNER_TEMP/failed/failed.txt" ]; then sort -u "$RUNNER_TEMP/failed/failed.txt" | sed "s/^/- /"; else echo "The part failed and named no test."; fi; } | tee -a "$GITHUB_STEP_SUMMARY"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: "!cancelled()"
        continue-on-error: true
        with:
          name: failed-${{ github.run_id }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/failed/
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore
  # The browser tests of each stack whose config sets `e2e:`: on a pull request only the ids the plan
  # routed here, skipped when it routed none, and on main and nightly every one. They run in the
  # Playwright image of the version the e2e lockfile pins, or with `browser-channel` on the
  # runner's own browser, whose version the job prints. A test that passes only on a retry fails
  # the job, and its report and traces are kept unless the run was cancelled. As a part of the tests
  # does, it writes the ids that failed to the summary and uploads them as failed-<run id>-browser,
  # and on a push to main runs them once more, for the ledger the `passed` job writes; the first
  # run's report and traces are kept beside the rerun's, under repo-standard-first-run/.
  browser:
    needs: plan
    if: needs.plan.outputs.mode == 'standard' && needs.plan.outputs.run == 'true' && needs.plan.outputs.reused != 'true' && needs.plan.outputs.marker != 'green' && needs.plan.outputs.browser != 'none'
    runs-on: ${{ inputs.runner }}
    container: ${{ inputs.browser-channel == '' && format('mcr.microsoft.com/playwright:v{0}-noble', needs.plan.outputs.playwright) || '' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      REPO_STANDARD_BROWSER_CHANNEL: ${{ inputs.browser-channel }}
    steps:
      - name: tools
        if: inputs.browser-channel == ''
        run: 'command -v git > /dev/null && command -v make > /dev/null && command -v python3 > /dev/null || { apt-get update -q && apt-get install -yq --no-install-recommends git make python3; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup
        if: hashFiles('.github/actions/setup/action.yml') != ''
        uses: ./.github/actions/setup
      - name: browser version
        if: inputs.browser-channel != ''
        run: 'case $REPO_STANDARD_BROWSER_CHANNEL in chrome*) browser="google-$REPO_STANDARD_BROWSER_CHANNEL";; msedge*) browser="microsoft-edge${REPO_STANDARD_BROWSER_CHANNEL#msedge}";; *) browser=$REPO_STANDARD_BROWSER_CHANNEL;; esac; command -v "$browser" > /dev/null || { echo "::error::browser-channel is $REPO_STANDARD_BROWSER_CHANNEL, and the runner has no $browser"; exit 1; }; "$browser" --version'
      - name: make e2e
        id: e2e
        env:
          BROWSER: ${{ needs.plan.outputs.browser }}
          IDS: ${{ needs.plan.outputs.browser-ids }}
        run: 'export REPO_STANDARD_FAILED="$GITHUB_WORKSPACE/repo-standard-failed/failed.txt"; mkdir -p "${REPO_STANDARD_FAILED%/*}" && : > "$REPO_STANDARD_FAILED"; if [ "$BROWSER" = all ]; then make e2e; else printf ''%s'' "$IDS" | python3 -c "import json, sys; [print(one) for one in json.load(sys.stdin)]" > "$RUNNER_TEMP/e2e-list.txt" && cat "$RUNNER_TEMP/e2e-list.txt" && make e2e E2E_LIST="$RUNNER_TEMP/e2e-list.txt"; fi'
      - name: again
        if: failure() && steps.e2e.outcome == 'failure' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        run: 'failed="$GITHUB_WORKSPACE/repo-standard-failed/failed.txt"; if [ ! -s "$failed" ]; then echo "the browser tests failed and named no test to run again"; exit 0; fi; sort -u "$failed" > "$RUNNER_TEMP/e2e-again.txt"; find . \( -name node_modules -o -name .git -o -name repo-standard-first-run \) -prune -o -type d \( -name playwright-report -o -name test-results \) -print -prune | while read -r kept; do mkdir -p "repo-standard-first-run/${kept%/*}" && cp -R "$kept" "repo-standard-first-run/$kept"; done; export REPO_STANDARD_FAILED="${failed%/*}/again.txt"; : > "$REPO_STANDARD_FAILED"; make e2e E2E_LIST="$RUNNER_TEMP/e2e-again.txt" || true'
      - name: failed tests
        if: failure() && steps.e2e.outcome == 'failure'
        run: 'failed="$GITHUB_WORKSPACE/repo-standard-failed/failed.txt"; { echo "### The browser tests failed"; echo; if [ -s "$failed" ]; then sort -u "$failed" | sed "s/^/- /"; else echo "The browser tests failed and named no test."; fi; } | tee -a "$GITHUB_STEP_SUMMARY"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: "!cancelled()"
        continue-on-error: true
        with:
          name: failed-${{ github.run_id }}-browser
          path: repo-standard-failed/
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: "!cancelled()"
        with:
          name: playwright-report
          path: "**/playwright-report/"
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: "!cancelled()"
        with:
          name: test-results
          path: "**/test-results/"
          retention-days: 14
          if-no-files-found: ignore
  # A repo with no .repo-standard.yml yet: its check command, alone.
  command:
    needs: plan
    if: needs.plan.outputs.mode == 'command' && github.event_name != 'schedule'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: setup
        if: hashFiles('.github/actions/setup/action.yml') != ''
        uses: ./.github/actions/setup
      - name: the check command
        env:
          REPO_STANDARD_COMMAND: ${{ inputs.command }}
        run: '[ -n "$REPO_STANDARD_COMMAND" ] || { echo "::error::the repo has no .repo-standard.yml and its caller gives no command"; exit 1; }; eval "$REPO_STANDARD_COMMAND"'
  # Passes only when every job the plan asked for passed: a job that failed, was cancelled or never
  # ran fails it, where a skipped job would count as passed, and a part that failed names its
  # failed tests. The browser job counts as passed when skipped, which it is when the plan routed it
  # no id. Where the tests failed on a push to the default branch, it first writes the run's ledger,
  # miss-ledger-<run id>, kept 90 days, one row a failed test (`repo-standard misses record`), which
  # a pull request's plan reads. Then it leaves the markers a later run reads: the pair of trees a
  # pull request's check passed, and the tree the whole suite passed.
  passed:
    if: always()
    needs: [plan, lint, test, browser, command]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.test.result == 'failure' || needs.browser.result == 'failure'
        continue-on-error: true
        with:
          pattern: failed-${{ github.run_id }}-*
          path: ${{ runner.temp }}/failed
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: (needs.test.result == 'failure' || needs.browser.result == 'failure') && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: ledger
        id: ledger
        if: (needs.test.result == 'failure' || needs.browser.result == 'failure') && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.plan.outputs.ref }}
        run: git clone -q --depth 1 --branch "$REF" "$REPO_STANDARD_UPSTREAM" "$RUNNER_TEMP/repo-standard" && PYTHONPATH="$RUNNER_TEMP/repo-standard/features/repo-standard/src" python3 -m repo_standard misses record --failed "$RUNNER_TEMP/failed" --out "$RUNNER_TEMP/ledger"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.ledger.outcome == 'success'
        continue-on-error: true
        with:
          name: miss-ledger-${{ github.run_id }}
          path: ${{ runner.temp }}/ledger/ledger.jsonl
          retention-days: 90
          overwrite: true
          if-no-files-found: error
      - name: every job passed
        env:
          PLAN: ${{ needs.plan.result }}
          MODE: ${{ needs.plan.outputs.mode }}
          RUN: ${{ needs.plan.outputs.run }}
          REUSED: ${{ needs.plan.outputs.reused }}
          MARKER: ${{ needs.plan.outputs.marker }}
          EVENT: ${{ github.event_name }}
          LINT: ${{ needs.lint.result }}
          TESTS: ${{ needs.test.result }}
          BROWSER: ${{ needs.browser.result }}
          COMMAND: ${{ needs.command.result }}
        run: 'fail() { echo "::error::$1"; exit 1; }; [ "$PLAN" = success ] || fail "the plan ended $PLAN"; if [ "$MODE" = command ]; then [ "$EVENT" = schedule ] || [ "$COMMAND" = success ] || fail "the check command ended $COMMAND"; elif [ "$RUN" = false ] && [ "$EVENT" = schedule ]; then echo "check.nightly is off in .repo-standard.yml, so the nightly run tests nothing"; elif [ "$RUN" != true ]; then fail "the plan said nothing of what to run"; else [ "$LINT" = success ] || fail "the lint ended $LINT"; [ "$TESTS" = success ] || [ "$REUSED" = true ] || [ "$MARKER" = green ] || { ids=$(cat "$RUNNER_TEMP"/failed/failed-*-[0-9]*/failed.txt 2> /dev/null | sort -u | tr "\n" " "); fail "the tests ended $TESTS${ids:+, and failed: ${ids% }}"; }; [ "$BROWSER" = success ] || [ "$BROWSER" = skipped ] || { ids=$(cat "$RUNNER_TEMP"/failed/failed-*-browser/failed.txt 2> /dev/null | sort -u | tr "\n" ";" | sed "s/;/; /g"); fail "the browser tests ended $BROWSER${ids:+, and failed: ${ids%; }}"; }; fi'
      - name: checked trees marker
        id: checked
        if: github.event_name == 'pull_request' && needs.plan.outputs.mode == 'standard' && needs.plan.outputs.run == 'true' && needs.plan.outputs.checked != '' && needs.plan.outputs.reused != 'true'
        env:
          NAME: ${{ needs.plan.outputs.checked }}
        run: mkdir -p "$RUNNER_TEMP/checked-tree" && touch "$RUNNER_TEMP/checked-tree/$NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.checked.outcome == 'success'
        continue-on-error: true
        with:
          name: ${{ needs.plan.outputs.checked }}
          path: ${{ runner.temp }}/checked-tree/${{ needs.plan.outputs.checked }}
          retention-days: 7
          if-no-files-found: error
      # A marker says the whole suite passed on the tree: main's run, a nightly run, or a pull
      # request whose selection was `all`. A deploy entry refuses a tree with none, through
      # `repo-standard green`, so the marker lives 90 days, as long as GitHub keeps a run.
      - name: green tree marker
        id: marker
        if: needs.plan.outputs.mode == 'standard' && needs.plan.outputs.run == 'true' && needs.plan.outputs.tree != '' && needs.plan.outputs.reused != 'true' && (github.event_name != 'pull_request' || needs.plan.outputs.selection == 'all')
        env:
          NAME: ${{ needs.plan.outputs.tree }}
        run: mkdir -p "$RUNNER_TEMP/green-tree" && touch "$RUNNER_TEMP/green-tree/$NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.marker.outcome == 'success'
        continue-on-error: true
        with:
          name: ${{ needs.plan.outputs.tree }}
          path: ${{ runner.temp }}/green-tree/${{ needs.plan.outputs.tree }}
          retention-days: 90
          if-no-files-found: error
