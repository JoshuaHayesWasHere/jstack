name: check

on:
  pull_request:
  push:
    branches: [main]
  # A manual run always runs the suite, whatever marker the tree has.
  workflow_dispatch:

permissions:
  contents: read
  # To read the marker a green run of the same tree left: an artifact of another run.
  actions: read

concurrency:
  # A push's run and a manual run are each a group of their own. In a shared group one run
  # waits at most, and the next one cancels it, whatever cancel-in-progress says: a burst of
  # merges left commits of main with no check at all.
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  # Only a pull request shares a group, its ref, and there a new push cancels the older run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request's check is the fast one: the lint, and the tests its change reaches. On
  # GitHub's merge of the pull request the first parent, HEAD^1, is the tip of main, so two
  # commits of history are enough and the diff is read from the local git, with no cap on
  # its files. A change the whole suite rests on runs all of it, but for the tests that open a
  # real browser, which browser.yml runs. It is the check the ruleset
  # requires, and jmerge's REQUIRED, so its name stays `check`.
  check:
    if: github.event_name == 'pull_request'
    # The runner is the repo's to name, in its variable RUNS_ON: one label as it is, or a list
    # of them as JSON, which starts with a bracket. With none it is the local ephemeral
    # runner, never GitHub's: every CI job runs locally, by the owner's word ("EVERYTHING CI
    # IS DONE LOCALLY. THAT IS THE DEFAULT."). This repo is public, so a stranger's pull
    # request reaches that runner only through GitHub's gate: the repo requires approval for
    # all external contributors, so a fork's run waits for the owner every time.
    runs-on: ${{ startsWith(vars.RUNS_ON, '[') && fromJSON(vars.RUNS_ON) || vars.RUNS_ON || 'jstack-ephemeral' }}
    # The full suite runs about 15 minutes on a 2-CPU runner, plus setup and cleanup: 25 leaves 10 minutes of headroom, and a hung run still stops.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # Fails if uv.lock does not match pyproject.toml, so CI runs the locked versions.
      - run: uv sync --locked
      # A fast run leaves no marker and asks for none: a marker says the full suite passed.
      - name: make check-fast
        run: make check-fast BASE=HEAD^1
  # The full suite, on each push to main, after the merge, and by hand. The tests that open a
  # real browser are not in it: browser.yml runs them, nightly and on a release.
  full:
    if: github.event_name != 'pull_request'
    runs-on: ${{ startsWith(vars.RUNS_ON, '[') && fromJSON(vars.RUNS_ON) || vars.RUNS_ON || 'jstack-ephemeral' }}
    # The full suite runs about 15 minutes on a 2-CPU runner, plus setup and cleanup: 25 leaves 10 minutes of headroom, and a hung run still stops.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A run that ends green leaves a marker named by the tree it checked out, and a run whose
      # tree has one skips the suite: it would test the same files again. The skip is on the
      # steps, and the job's `if` is the event's alone, so a push to main always reports
      # `full`. A run that cannot ask runs the suite. A marker is a green run's artifact, or a
      # ref the desk pushed after jmerge's fresh check of the same tree passed. That check ran
      # in an environment nobody locked, so a run skipped on the desk's marker still proves
      # the lock.
      - name: green tree
        id: tree
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/green_tree.py
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.tree.outputs.marker != 'green' || steps.tree.outputs.from == 'desk'
      - run: uv sync --locked
        if: steps.tree.outputs.marker != 'green' || steps.tree.outputs.from == 'desk'
      - name: make check
        id: suite
        if: steps.tree.outputs.marker != 'green'
        run: make check
      # Only after the suite ran and passed. A marker that cannot be kept costs the next run
      # of this tree its skip and nothing else.
      - name: green tree marker
        id: marker
        if: steps.suite.outcome == 'success' && steps.tree.outputs.name != ''
        env:
          NAME: ${{ steps.tree.outputs.name }}
        run: mkdir -p "$RUNNER_TEMP/green-tree" && touch "$RUNNER_TEMP/green-tree/$NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        if: steps.marker.outcome == 'success'
        continue-on-error: true
        with:
          name: ${{ steps.tree.outputs.name }}
          path: ${{ runner.temp }}/green-tree/${{ steps.tree.outputs.name }}
          retention-days: 7
          if-no-files-found: error
      # A lookup or an upload that does not work never fails the run, so it says so here.
      - name: green tree warnings
        if: steps.tree.outcome == 'failure' || steps.upload.outcome == 'failure'
        run: echo "::warning::green-tree, the lookup ended ${{ steps.tree.outcome }} and the upload ${{ steps.upload.outcome }}, so a later run of this tree may not skip the suite"
