name: check

on:
  pull_request:
    # A pull request's check runs once, at main's gate: on a pull request into main that is not a
    # draft. A crew opens its pull request as a draft and marks it ready once its fix round is
    # pushed, so `ready_for_review` runs the check on the head that goes to the merge, and a push
    # of work in progress runs none (the jobs' `if` skips a draft). Work into any other branch, a
    # parent row's branch or a train, is checked on each push to that train and again when it
    # lands on main.
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # An integration branch, the train `unslop` or any `train/...`, is checked on each push as
  # main is, so a break there is seen before it lands, and jmerge's red hold for a pull
  # request into it reads its tip.
  push:
    branches: [main, unslop, 'train/**']
  # A manual run always runs the suite, whatever marker the tree has.
  workflow_dispatch:

permissions:
  contents: read
  # To read the marker a green run of the same tree left: an artifact of another run.
  actions: read

concurrency:
  # A push's run and a manual run are each a group of their own. In a shared group one run
  # waits at most, and the next one cancels it, whatever cancel-in-progress says: a burst of
  # merges left commits of main with no check at all.
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  # Only a pull request shares a group, its ref, and there a new push cancels the older run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The uv every setup-uv step installs: with none setup-uv fetches the latest release on
  # each job. check.yml, browser.yml and pstack-drift.yml name the same one
  # (testing/tests/test_workflows.py).
  UV_VERSION: "0.13.2"

jobs:
  # A pull request's check is the fast one: the lint, and the tests its change reaches. On
  # GitHub's merge of the pull request the first parent, HEAD^1, is the tip of main, so two
  # commits of history are enough and the diff is read from the local git, with no cap on
  # its files. A change the whole suite rests on runs all of it, but for the tests that open a
  # real browser, which browser.yml runs. The tests run as four jobs side by side, each with a
  # quarter of what the change selected (`SHARD`, testing/shard.py), and the job `check` below
  # passes only when all four did.
  check-shard:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    name: check ${{ matrix.shard }} of 4
    # Every job of every workflow runs on GitHub's hosted runner, by the owner's word ("all
    # jstack CI can be done on via github", 2026-10-22): the repo is public, so its minutes
    # cost nothing. The image is pinned, not ubuntu-latest, so a new Ubuntu release comes only
    # with a change to this file. GitHub still refreshes the image about weekly, so the
    # versions of what the suite finds there (Google Chrome, git, gh, jq) move with it.
    runs-on: ubuntu-24.04
    # A change the whole suite rests on runs all of it, as `full` does, so the cap is full's.
    timeout-minutes: 30
    strategy:
      # Every part runs to its end, so a red check names every failing test, not only the
      # first part's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    outputs:
      selection: ${{ steps.suite.outputs.selection }}
      tree: ${{ steps.tree.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      # Fails if uv.lock does not match pyproject.toml, so CI runs the locked versions.
      - run: uv sync --locked
      # The suite runs the skills' shell blocks under zsh as well as sh, since a crewmate's
      # shell may be zsh, and GitHub's image has no zsh.
      - name: zsh
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends zsh
      # The tree checked out, GitHub's merge of the head over main: what a marker is named by.
      - name: green tree
        id: tree
        run: echo "name=green-tree-$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      # TLC's output for each run of the specs, kept by the sha256 of what the run reads
      # (statechart's `kept`): a run whose spec, config, script, jar and Java are those of a run
      # kept here starts no Java. A test's part is fixed by its id, so each part keeps its own
      # runs. Every run saves under a key of its own, and restores the latest of its part, of
      # the same spec files first, else of any: a stale entry is never read, since each file is
      # named by the hash of its own inputs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/jstack/tlc
          key: tlc-${{ matrix.shard }}-${{ hashFiles('features/home/spec/**', 'features/jmerge/spec/**', 'features/skill-library/skills/statechart/scripts/**') }}-${{ github.run_id }}
          restore-keys: |
            tlc-${{ matrix.shard }}-${{ hashFiles('features/home/spec/**', 'features/jmerge/spec/**', 'features/skill-library/skills/statechart/scripts/**') }}-
            tlc-${{ matrix.shard }}-
      # scripts/select_tests.py adds its selection to the job summary, as one line, and gives
      # this step the output `selection`: `all` where it ran the whole suite, which it does
      # when its selection is 80% of the test files or more.
      - name: make check-fast
        id: suite
        run: make check-fast BASE=HEAD^1 SHARD=${{ matrix.shard }}/4
      # A pull request whose title, body or any commit from base to head credits an AI tool as a
      # co-author fails here, with each line named. It runs whatever the suite said, so a red
      # suite does not hide it, and in the first part only, since it reads no test. The commits
      # come from GitHub's compare API, not this checkout's two commits of history.
      - name: no AI co-author trailer
        if: "!cancelled() && steps.suite.outcome != 'skipped' && matrix.shard == 1"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/no_ai_trailers.py
      # Whether the suite ran whole, and on which tree, in the job summary and as the job's
      # telemetry, which `jbus ci` keeps in ci.jsonl: the full runs a pull request had.
      - name: full suite
        if: "!cancelled() && steps.suite.outcome != 'skipped'"
        continue-on-error: true
        env:
          FULL: ${{ steps.suite.outputs.selection == 'all' }}
          NAME: ${{ steps.tree.outputs.name }}
        run: 'echo "full suite: $([ "$FULL" = true ] && echo yes || echo no), tree ${NAME#green-tree-}" >> "$GITHUB_STEP_SUMMARY" && uv run jbus ci --notice full="$FULL" tree="${NAME#green-tree-}"'
  # The check the ruleset requires, and jmerge's REQUIRED, so its name stays `check`. It runs
  # whatever the parts did, and passes only when all four passed: a part that failed, was
  # cancelled or never ran fails it, where a skipped required check would count as passed.
  # On a draft it is skipped with its parts: GitHub merges no draft, and jmerge waits on one.
  check:
    if: always() && github.event_name == 'pull_request' && !github.event.pull_request.draft
    needs: check-shard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every part passed
        env:
          PARTS: ${{ needs.check-shard.result }}
        run: '[ "$PARTS" = success ] || { echo "::error::the parts of the check ended $PARTS, not success"; exit 1; }'
      # As `full` does: a run that ran the whole suite and passed leaves a marker named by the
      # tree, and a fast run leaves none, since a marker says the full suite passed. A later
      # run of the same tree, main's after a squash merge or jmerge's fresh check, skips the
      # suite on it. A marker that cannot be kept costs that skip and nothing else.
      - name: green tree marker
        id: marker
        if: needs.check-shard.result == 'success' && needs.check-shard.outputs.selection == 'all'
        env:
          NAME: ${{ needs.check-shard.outputs.tree }}
        run: mkdir -p "$RUNNER_TEMP/green-tree" && touch "$RUNNER_TEMP/green-tree/$NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        if: steps.marker.outcome == 'success'
        continue-on-error: true
        with:
          name: ${{ needs.check-shard.outputs.tree }}
          path: ${{ runner.temp }}/green-tree/${{ needs.check-shard.outputs.tree }}
          retention-days: 7
          if-no-files-found: error
  # The full suite, on each push to main, after the merge, and by hand. The tests that open a
  # real browser are not in it: browser.yml runs them, nightly and on a release. It runs as
  # four jobs side by side, as the check does, and the job `full` below passes only when all
  # four did.
  full-shard:
    if: github.event_name != 'pull_request'
    name: full ${{ matrix.shard }} of 4
    # GitHub's hosted runner, as the check's. The job took 9 and 15 minutes on two runs of
    # 2026-10-22, the same suite on runners of the same image: 30 leaves room for a slow one,
    # and a hung run still stops.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    outputs:
      tree: ${{ steps.tree.outputs.name }}
      lookup: ${{ steps.tree.outcome }}
      suite: ${{ steps.suite.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A run that ends green leaves a marker named by the tree it checked out, and a run whose
      # tree has one skips the suite: it would test the same files again. The skip is on the
      # steps, and the job's `if` is the event's alone, so a push to main always reports
      # `full`. A run that cannot ask runs the suite. A marker is a green run's artifact, or a
      # ref `refs/jstack/green-tree/full/<tree>` the desk pushed after jmerge's fresh check ran
      # `make check` on the same tree and it passed. The desk's `selected/<tree>` ref, from a
      # fresh check of selected tests (`make check-fast`), skips nothing here: on 2026-10-23 one
      # skipped this suite on a tree whose whole suite failed. The desk's check ran in an
      # environment nobody locked, so a run skipped on the desk's marker still proves the lock.
      - name: green tree
        id: tree
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/green_tree.py
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
        if: steps.tree.outputs.marker != 'green' || steps.tree.outputs.from == 'desk'
      - run: uv sync --locked
        if: steps.tree.outputs.marker != 'green' || steps.tree.outputs.from == 'desk'
      # The suite runs the skills' shell blocks under zsh as well as sh, since a crewmate's
      # shell may be zsh, and GitHub's image has no zsh.
      - name: zsh
        if: steps.tree.outputs.marker != 'green'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends zsh
      # TLC's kept output, as in the check's parts.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.tree.outputs.marker != 'green'
        with:
          path: ~/.cache/jstack/tlc
          key: tlc-${{ matrix.shard }}-${{ hashFiles('features/home/spec/**', 'features/jmerge/spec/**', 'features/skill-library/skills/statechart/scripts/**') }}-${{ github.run_id }}
          restore-keys: |
            tlc-${{ matrix.shard }}-${{ hashFiles('features/home/spec/**', 'features/jmerge/spec/**', 'features/skill-library/skills/statechart/scripts/**') }}-
            tlc-${{ matrix.shard }}-
      - name: make check
        id: suite
        if: steps.tree.outputs.marker != 'green'
        run: make check JUNIT="$RUNNER_TEMP/junit.xml" SHARD=${{ matrix.shard }}/4
      # One line on the job's summary for ci.jsonl, after the suite ran, passed or failed: the
      # workers, the CPU quota they were counted from, the suite's wall, the test time summed
      # over every test, the tail (the wall less that sum shared out over the workers: the time
      # the workers were not all busy), the slowest file, and the CPU pressure of the machine
      # and of this runner's cgroup. GitHub's hosted runner sets no CPU quota, so its quota
      # reads `none`.
      - name: suite summary
        if: "!cancelled() && (steps.suite.outcome == 'success' || steps.suite.outcome == 'failure')"
        continue-on-error: true
        env:
          JUNIT: ${{ runner.temp }}/junit.xml
        run: |
          WORKERS=$(make -n check | sed -n 's/.*pytest -n \([0-9]*\) .*/\1/p') python3 - << 'EOF'
          import collections, os, xml.etree.ElementTree as tree

          def first(path):
              try:
                  with open(path) as lines:
                      return lines.readline().strip() or "none"
              except OSError:
                  return "none"

          quota = first(os.environ.get("CPU_MAX", "/sys/fs/cgroup/cpu.max")).split()
          quota = f"{int(quota[0]) / int(quota[1]):g}" if len(quota) == 2 and quota[0] != "max" else "none"
          workers = int(os.environ.get("WORKERS") or 1)
          suite = tree.parse(os.environ["JUNIT"]).getroot()
          suite = suite if suite.tag == "testsuite" else suite.find("testsuite")
          files = collections.Counter()
          for case in suite.iter("testcase"):
              parts = case.get("classname", "").split(".")
              while len(parts) > 1 and parts[-1].startswith("Test"):
                  parts.pop()
              files["/".join(parts) + ".py"] += float(case.get("time") or 0)
          wall, summed = float(suite.get("time")), sum(files.values())
          slowest, seconds = files.most_common(1)[0] if files else ("none", 0.0)
          line = (
              f"suite: {workers} workers, quota {quota}, wall {wall:.1f} s,"
              f" test time {summed:.1f} s, tail {wall - summed / workers:.1f} s,"
              f" slowest {slowest} {seconds:.1f} s,"
              f" host cpu {first(os.environ.get('HOST_PRESSURE', '/proc/pressure/cpu'))},"
              f" cgroup cpu {first(os.environ.get('CGROUP_PRESSURE', '/sys/fs/cgroup/cpu.pressure'))}"
          )
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(line + "\n")
          EOF
  # What a push's run reports, as `check` does for a pull request: it passes only when all four
  # parts passed, and fails on a part that failed, was cancelled or never ran.
  full:
    if: always() && github.event_name != 'pull_request'
    needs: full-shard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every part passed
        env:
          PARTS: ${{ needs.full-shard.result }}
        run: '[ "$PARTS" = success ] || { echo "::error::the parts of the full run ended $PARTS, not success"; exit 1; }'
      # Only after the suite ran and passed in the parts. A marker that cannot be kept costs
      # the next run of this tree its skip and nothing else.
      - name: green tree marker
        id: marker
        if: needs.full-shard.result == 'success' && needs.full-shard.outputs.suite == 'success' && needs.full-shard.outputs.tree != ''
        env:
          NAME: ${{ needs.full-shard.outputs.tree }}
        run: mkdir -p "$RUNNER_TEMP/green-tree" && touch "$RUNNER_TEMP/green-tree/$NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        if: steps.marker.outcome == 'success'
        continue-on-error: true
        with:
          name: ${{ needs.full-shard.outputs.tree }}
          path: ${{ runner.temp }}/green-tree/${{ needs.full-shard.outputs.tree }}
          retention-days: 7
          if-no-files-found: error
      # A lookup or an upload that does not work never fails the run, so it says so here.
      - name: green tree warnings
        if: needs.full-shard.outputs.lookup == 'failure' || steps.upload.outcome == 'failure'
        run: echo "::warning::green-tree, the lookup ended ${{ needs.full-shard.outputs.lookup }} and the upload ${{ steps.upload.outcome }}, so a later run of this tree may not skip the suite"
