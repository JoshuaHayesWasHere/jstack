name: check

on:
  pull_request:
    # A pull request's check runs on each push of a pull request into any branch, a draft too: a
    # crew opens its pull request ready (fl-no-draft), so its check runs beside its review. A
    # link jbus stacked on a parent row's branch is checked while it is stacked, beside its
    # parent's own check, and its move onto main reuses that pass where it checks the same trees
    # (`reuse`). `ready_for_review` stays for browser.yml, which has these types and skips a
    # draft, so a draft someone opened by hand runs its browser tests once it is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  # A push to main runs what the merges since main's last checked commit reach, in the check's
  # parts (`reuse`, `check-shard`, `check`), not the whole suite: the owner's word of 2026-11-08,
  # "we should only be running the full test suite before releases and nightly - not every CI
  # run". The whole suite ran 31.6 job-minutes on 431 of 474 pushes in 7 days.
  push:
    branches: [main]
  # The whole suite (`full-shard`, `full`), nightly at 01:00 ET, an hour before browser.yml and
  # two before macos-nightly. GitHub runs a schedule only from the default branch's file.
  schedule:
    - cron: '0 6 * * *'
  # A manual run always runs the whole suite, whatever marker the tree has: a release starts one
  # for its tag where the tag's tree has no marker (`make release-green`).
  workflow_dispatch:

permissions:
  contents: read
  # To read the marker a green run of the same tree left: an artifact of another run.
  actions: read

concurrency:
  # Every push to main shares the group `check-main`: one run goes on, and one waits at most,
  # since GitHub cancels a waiting run, before it has a job, when a newer push displaces it,
  # whatever cancel-in-progress says. So a burst of merges is checked by a few runs, each over
  # every merge since the last run that ran (`green_tree.py --last-checked`), and the commit a
  # cancelled run waited on is in the next run's range (`jbus.watch._check` reads it as
  # `batched`). A nightly and a manual run are each a group of their own.
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'push' && 'main' || github.run_id }}
  # A pull request's group is its ref, and there a new push cancels the older run. A running
  # push run is never cancelled: it checks merges no later run selects again.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The uv every setup-uv step installs: with none setup-uv fetches the latest release on
  # each job. check.yml, browser.yml and pstack-drift.yml name the same one
  # (testing/tests/test_workflows.py).
  UV_VERSION: "0.13.2"
  # What both zsh steps install: noble's two .debs, each after its SHA-256, from Ubuntu's own
  # archive. apt fetches from the image's Azure mirror, which at times serves 39 kB/s: its
  # `apt-get update` and install took the step 140 to 270 seconds. Noble's release pocket
  # keeps these files for as long as noble lives, and a file that is not this one fails the
  # step before anything is installed. A cache keyed by ZSH_DEBS holds the two files, and a
  # miss fetches them, with curl retrying any error after a growing wait.
  ZSH_POOL: http://archive.ubuntu.com/ubuntu/pool/main/z/zsh
  ZSH_DEBS: "56d160585b417af0cc04d7372f74a3b734609d7cc43ef8ea6e92bfdfc27f77c3 zsh-common_5.9-6ubuntu2_all.deb bd5cc8dd3a01a6db38c0a815d75202c356a9c7f378674ba7bed9bc86dcba8af0 zsh_5.9-6ubuntu2_amd64.deb"

jobs:
  # Whether a passed check already checked the two trees this run checks: GitHub's merge of the
  # head over its base, and that base (`jmerge.reuse`). The pair fixes what the parts select and
  # test, so a run of a pair that passed skips the parts, and `check` passes on the reuse in the
  # time the lookup takes. A stacked link's move onto main checks the pair its stacked run passed
  # where the move replays the same trees, so the move adds no round of the suite in series. The
  # lookup is plain python on the runner, with `gh` and the run's token (`actions: read`), before
  # any `uv sync`. Where it reuses nothing, the same job selects the tests the change needs and
  # deals their files out to the eight parts (`select`), and hands them over as the artifact
  # `selection-<attempt>`: the parts start with this job, set up while it runs, and wait for that
  # file alone. A job of its own for the selection, after this one, held the parts back about
  # 40 s more, and parts that waited for this job's end started their tests 32 s after the run's
  # creation (median of 24 runs, 2026-11-08), their own setup 12 s of it. A push to main asks
  # for no reuse: it selects over main's last checked commit and its own (`last checked`).
  reuse:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      name: ${{ steps.reuse.outputs.name }}
      reused: ${{ steps.reuse.outputs.reused }}
      failed: ${{ steps.failed.outputs.tests }}
      lookup: ${{ steps.failed.outcome }}
      selection: ${{ steps.select.outputs.selection }}
      files: ${{ steps.select.outputs.files }}
      forced_by: ${{ steps.select.outputs.forced_by }}
      tree: ${{ steps.tree.outputs.name }}
      part1: ${{ steps.select.outputs.part1 }}
      part2: ${{ steps.select.outputs.part2 }}
      part3: ${{ steps.select.outputs.part3 }}
      part4: ${{ steps.select.outputs.part4 }}
      part5: ${{ steps.select.outputs.part5 }}
      part6: ${{ steps.select.outputs.part6 }}
      part7: ${{ steps.select.outputs.part7 }}
      part8: ${{ steps.select.outputs.part8 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: reuse
        id: reuse
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=features/jmerge/src python3 -m jmerge.reuse
      # A push's base: the newest commit of main under this one whose push run of check.yml ran
      # to an end, fetched, so the selection covers every merge a displaced run waited on. Where
      # GitHub does not say, the base is git's empty tree and the selection is the whole suite.
      - name: last checked
        id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/green_tree.py --last-checked check.yml
      # The tests that failed on main in the last 30 days and that no later green run of main
      # passed, which every part adds to what it selects (`select_tests.py --failed-on-main`):
      # timing tests no pull request reached broke main in 8 of the audit's 15 reds. The lookup
      # reads the logs of main's red jobs, and the cache keeps what each log named, so a run lists
      # the last 4 days of main's runs and reads the logs of new reds only. A cache saved on main,
      # by `full`, is one every pull request can restore. The key's `2` is the form of the file,
      # whose days keep their newest green run: a file of the old form is never restored. A
      # lookup that fails adds no test, and `check` warns of it. One GitHub answers 403 or 429,
      # its allowance spent, prints `all` and passes, and `select` runs the whole suite.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.reuse.outputs.reused != 'true'
        with:
          path: ~/.cache/jstack/failed-on-main.json
          key: failed-on-main-2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: failed-on-main-2-
      - name: failed on main
        id: failed
        if: steps.reuse.outputs.reused != 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: 'tests=$(python3 scripts/select_tests.py --failed-on-main 30 ~/.cache/jstack/failed-on-main.json) && echo "tests=$(echo $tests)" >> "$GITHUB_OUTPUT"'
      # The tree checked out, GitHub's merge of the head over main: what a marker is named by.
      - name: green tree
        id: tree
        if: steps.reuse.outputs.reused != 'true'
        run: echo "name=green-tree-$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      # What select_tests.py read of each module (`KEPT`), kept from a run before, so it parses
      # again only the modules whose text changed: a cold run parsed every module, about 2 s of
      # the step on a desk. A run restores the latest entry of the same selector and saves its
      # own when the job passes. The key hashes the selector, so a changed script never starts
      # from an entry an older one wrote, and the script itself drops a file whose salt is not
      # its own.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.reuse.outputs.reused != 'true'
        with:
          path: .git/select_tests.facts
          key: select-facts-${{ hashFiles('scripts/select_tests.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: select-facts-${{ hashFiles('scripts/select_tests.py') }}-
      # scripts/select_tests.py adds its selection and its parts to the job summary, and gives
      # this step the outputs `part1` to `part8` and `selection`: `all` where it selected the
      # whole suite, which it does only for a change the whole suite rests on, however many test
      # files a selection holds. It adds the tests that failed on main (the step above), and the
      # summary names those it added. A selection of no test file fails here. It also gives
      # `files`, `all` or how many test files it selected, and `forced_by`, the path that made it
      # `all`, and writes the selection's list to `SELECTED` and the summary: each file it
      # selected, the causes that selected it and the part that runs it. It collects nothing and
      # needs no pytest, so it runs in the runner's python3 before any `uv sync`. A pull
      # request passes `--pull-request` (`REACH`): an import reaches only the tests near the
      # change, the tests that import a changed module and those that import a module that
      # names a name the diff touched. A push to main keeps the wide rule, and the nightly full
      # suite catches what either leaves out.
      - name: select
        id: select
        if: steps.reuse.outputs.reused != 'true'
        env:
          FAILED_ON_MAIN: ${{ steps.failed.outputs.tests }}
          SELECTED: ${{ runner.temp }}/selected-tests.txt
          BASE: ${{ steps.base.outputs.base || 'HEAD^1' }}
          REACH: ${{ github.event_name == 'pull_request' && '--pull-request' || '' }}
        run: python3 scripts/select_tests.py $REACH --parts 8 "$BASE" HEAD
      # What the parts read of this job, its selection and whether it reused a pass, as one
      # artifact the moment the selection is made: the parts start with this job and set up
      # while it runs, and wait for this file, not for the job's end (`check-shard`). It is
      # kept also on a reuse, where it holds `reused` and no part, and where the selection
      # failed, where a part finds no files and fails.
      - name: selection
        if: "!cancelled()"
        env:
          SELECT: ${{ toJSON(steps.select.outputs) }}
          TREE: ${{ steps.tree.outputs.name }}
          REUSED: ${{ steps.reuse.outputs.reused }}
        run: >-
          mkdir -p "$RUNNER_TEMP/selection" && jq -n --argjson select "$SELECT" --arg tree "$TREE" --arg reused "$REUSED"
          '$select + {tree: $tree, reused: $reused}' > "$RUNNER_TEMP/selection/selection.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: "!cancelled()"
        with:
          name: selection-${{ github.run_attempt }}
          path: ${{ runner.temp }}/selection/selection.json
          # A run's failed jobs can be run again for 30 days, and a part run again alone reads
          # this file.
          retention-days: 30
          if-no-files-found: error
      # The test files the check selected, one a line with why and its part, kept for each
      # attempt, also where the selection failed. A list that cannot be kept costs that lookup
      # and nothing else.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: "!cancelled() && steps.reuse.outputs.reused != 'true'"
        continue-on-error: true
        with:
          name: selected-tests-${{ github.run_attempt }}
          path: ${{ runner.temp }}/selected-tests.txt
          retention-days: 30
          if-no-files-found: error
      # A pull request whose title, body or any commit from base to head credits an AI tool as a
      # co-author fails here, with each line named. It runs on every run, a reuse included: the
      # two trees fix the files, and not the title, the body or a commit's message, which a push
      # that keeps the trees can still change. It reads no test, so it runs here, once, and
      # `check` fails when this job did. The commits come from a git fetch of `origin`, with no
      # trees, not this checkout's two commits of history and not GitHub's compare API: a fetch
      # spends none of the run's token's allowance. The patterns need only the runner's python3. It
      # runs also where the selection failed, so a red check names both. A push to main has no
      # pull request: its pull request's check ran it.
      - name: no AI co-author trailer
        if: "!cancelled() && github.event_name == 'pull_request'"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: PYTHONPATH=features/jmerge/src:features/jleak/src python3 scripts/no_ai_trailers.py
  # The lint reads no test and needs no selection, so it is a job of its own that starts with
  # `reuse` and the parts: it holds back no part. It runs on a reuse too, where it passes on the
  # same trees.
  # `check` fails when it did.
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      # Fails if uv.lock does not match pyproject.toml, so CI runs the locked versions.
      - run: uv sync --locked
      - name: prose lint
        run: python3 features/writing/scripts/prose_lint.py HEAD^1
      # jstack holds to its own standard, at the version .repo-standard.yml pins: `make lint`
      # runs `repo-standard conform` last, so the desk lint and this step fail on the same rules.
      - name: make lint
        run: make lint BASE=HEAD^1
  # The tests run as eight jobs side by side, each with the files `reuse` dealt it, and the job
  # `check` below passes only when all eight did. Eight, not four, halves the check's wall: a
  # part took p50 7.2 min of four on 2026-10-28..11-02. The account runs at most 40 hosted jobs
  # at once (no more than 40 ran in ci.jsonl since 10-14, and jobs queued there): a head's eight
  # parts start with `reuse` and `lint`, so with borders and macos it is twelve jobs at once
  # for the first 15 s or so, then ten, and three heads start at once and a fourth queues.
  # A part needs no job: it sets up while `reuse` selects, then waits for the selection's
  # artifact (`selection`), so its setup is off the path to its first test. It runs whatever
  # `reuse` did, so that a trailer that failed there still runs the tests, a reuse passes it
  # with no test run, and a part that got no files fails before `make test`. A push to main
  # runs its selection in the same eight parts.
  check-shard:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    name: check ${{ matrix.shard }} of 8
    # Every job of every workflow runs on GitHub's hosted runner, by the owner's word ("all
    # jstack CI can be done on via github", 2026-10-22): the repo is public, so its minutes
    # cost nothing. The image is pinned, not ubuntu-latest, so a new Ubuntu release comes only
    # with a change to this file. GitHub still refreshes the image about weekly, so the
    # versions of what the suite finds there (Google Chrome, git, gh, jq) move with it.
    runs-on: ubuntu-24.04
    # A change the whole suite rests on runs all of it, as `full` does, so the cap is full's.
    timeout-minutes: 30
    strategy:
      # Every part runs to its end, so a red check names every failing test, not only the
      # first part's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      # Fails if uv.lock does not match pyproject.toml, so CI runs the locked versions.
      - run: uv sync --locked
      # The suite runs the skills' shell blocks under zsh as well as sh, since a crewmate's
      # shell may be zsh, and GitHub's image has no zsh. It ends with `zsh --version`, so a
      # step that installed none fails.
      # The two .debs, kept by ZSH_DEBS, in the folder the zsh step fetches into: a run after
      # the first fetches nothing from Ubuntu's pool, which on 2026-11-09 reset six parts'
      # fetches mid-transfer (curl exit 56, which `--retry` alone does not retry).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/zsh-debs
          key: zsh-debs-${{ env.ZSH_DEBS }}
      - name: zsh
        run: 'mkdir -p "$RUNNER_TEMP/zsh-debs" && cd "$RUNNER_TEMP/zsh-debs" && set -- $ZSH_DEBS && printf "%s  %s\n" $ZSH_DEBS > ../zsh.sha256 && { sha256sum --status -c ../zsh.sha256 && echo "zsh: the .debs from the cache" || { curl -fsSL --retry 5 --retry-all-errors --remote-name-all "$ZSH_POOL/$2" "$ZSH_POOL/$4" && sha256sum -c ../zsh.sha256; }; } && sudo dpkg -i "$2" "$4" && zsh --version'
      # The pinned tla2tools.jar, where statechart's `cached_jar` looks for it, so a run after
      # the first fetches nothing from GitHub's release download, which answered a part 504
      # (run 42584414866). The key is the version and sha256 tools.py pins, read from it, so the
      # pin stays written in one place and a new one looks for an entry of its own.
      - name: tla2tools pin
        id: tla2tools
        run: 'pin=$(sed -n -e "s/^TLA2TOOLS_VERSION = \"\(.*\)\"$/version=\1/p" -e "s/^TLA2TOOLS_SHA256 = \"\(.*\)\"$/sha256=\1/p" features/skill-library/skills/statechart/scripts/statechart/tools.py) && [ "$(printf "%s\n" "$pin" | wc -l)" -eq 2 ] && printf "%s\n" "$pin" | tee -a "$GITHUB_OUTPUT" || { echo "::error::tools.py pins no TLA2TOOLS_VERSION and TLA2TOOLS_SHA256 this step reads"; exit 1; }'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/jstack/tla2tools/${{ steps.tla2tools.outputs.version }}/tla2tools.jar
          key: tla2tools-${{ steps.tla2tools.outputs.version }}-${{ steps.tla2tools.outputs.sha256 }}
      # TLC's output for each run of the specs, kept by the sha256 of what the run reads
      # (statechart's `kept`): a run whose spec, config, script, jar and Java are those of a run
      # kept here starts no Java. One cache serves every part, since which part a test lands in
      # changes with the selection: a part restores the latest entry of the same spec files, else
      # the latest of any, and a pull request finds main's. The key hashes the specs, their
      # configs and statechart's scripts, whose tools.py pins TLC's jar, so a change to any of
      # them looks for an entry of its own. A stale file is never read, since each is named by
      # the hash of its own inputs. `tlc kept` and the save after the suite keep what it added.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tlc
        with:
          path: ~/.cache/jstack/tlc
          key: tlc-${{ hashFiles('features/home/spec/**', 'features/jmerge/spec/**', 'features/skill-library/skills/statechart/scripts/**') }}-
          restore-keys: |
            tlc-${{ hashFiles('features/home/spec/**', 'features/jmerge/spec/**', 'features/skill-library/skills/statechart/scripts/**') }}-
            tlc-
      # The selection `reuse` uploads as `selection-<attempt>`, waited for here with the part's
      # setup done, and given as this step's outputs: `reused`, `tree`, `selection`, `files`,
      # `forced_by` and `part1` to `part8` (scripts/selection_wait.py). It asks for this
      # attempt's artifact once a second, each ask after the first with the ETag of the answer
      # before it, which GitHub answers 304 at no cost while nothing changed: a part makes 3
      # costed calls of the run's token's 1,000 an hour, where the old loop made one an ask
      # (testing/tests/test_ci_api_calls.py). A part of a run again whose `reuse` is not of its
      # attempt, as when only the failed jobs run again, takes the newest selection of the run,
      # and a part still waiting after a minute asks whether `reuse` ended with none, and fails
      # then, not at its timeout. The run's token reads the run's artifacts (`actions: read`).
      - name: selection
        id: selection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/selection_wait.py
      # The part's files, or `none` where the selection left this part empty, which passes. A
      # part that got nothing, as when the selection failed before its outputs, fails: with no
      # files `make test` would run the whole suite. A reuse runs neither this nor the tests.
      - name: part
        if: steps.selection.outputs.reused != 'true'
        env:
          PART: ${{ steps.selection.outputs[format('part{0}', matrix.shard)] }}
        run: '[ -n "$PART" ] || { echo "::error::this part got no selection from the job reuse"; exit 1; }'
      # Collects only the part's own files. It records, as its tests run, the lines of the feature
      # code this change touches that each test file ran (`NEW_LINES_PART`, the Makefile), which
      # `check` reads for the guard of test_new_lines_run.py: that guard ran the tests that name
      # each changed module a second time, under coverage, inside one part, and so bound the
      # slowest part in 25 of 43 large runs (21 to 362 s, 2026-11-07..08). The part skips it.
      - name: make test
        id: suite
        if: steps.selection.outputs.reused != 'true'
        env:
          PART: ${{ steps.selection.outputs[format('part{0}', matrix.shard)] }}
        run: '[ "$PART" = none ] || make test TESTS="$PART" NEW_LINES_PART="$RUNNER_TEMP/new-lines"'
      # After the suite, passed or failed, since a kept run is one TLC finished: a part whose
      # cache now holds runs it did not restore saves them, under the key it restored with (the
      # spec files' hash, taken before the suite wrote `__pycache__` under the hashed paths) and
      # a hash of the names of the runs it holds, which ends the key it restored. So the part
      # that ran TLC saves an entry of its own, and is not beaten to one shared key by a faster
      # part that holds only what it restored. A part that added nothing saves nothing, and two
      # parts that hold the same runs name the same entry.
      - name: tlc kept
        id: kept
        if: "!cancelled() && steps.suite.outcome != 'skipped'"
        env:
          KEY: ${{ steps.tlc.outputs.cache-primary-key }}
          RESTORED: ${{ steps.tlc.outputs.cache-matched-key }}
        run: 'RUNS=$(LC_ALL=C ls "$HOME/.cache/jstack/tlc" 2> /dev/null) || exit 0; NAMES=$(printf "%s\n" "$RUNS" | sha256sum | cut -c1-16); [ -z "$RUNS" ] || [ "$NAMES" = "${RESTORED##*-}" ] || echo "key=$KEY$NAMES" >> "$GITHUB_OUTPUT"'
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: "!cancelled() && steps.kept.outputs.key != ''"
        with:
          path: ~/.cache/jstack/tlc
          key: ${{ steps.kept.outputs.key }}
      # What the part recorded, for `check`; none where the change touches no feature code. One
      # that cannot be kept costs `check` a run of the tests its lines need, and nothing else.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: "!cancelled() && steps.suite.outcome != 'skipped'"
        continue-on-error: true
        with:
          name: new-lines-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/new-lines
          retention-days: 1
          if-no-files-found: ignore
      # Whether the suite ran whole, and on which tree, in the job summary and as the job's
      # telemetry, which `jbus ci` keeps in ci.jsonl: the full runs a pull request had, what its
      # check selected (`all` or how many test files, and the path that forced `all`), so a red
      # on main can be checked against its culprit's selection, and /tmp's inode use once the
      # suite ran, for the CI report's /tmp inode peak.
      - name: full suite
        if: "!cancelled() && steps.suite.outcome != 'skipped'"
        continue-on-error: true
        env:
          FULL: ${{ steps.selection.outputs.selection == 'all' }}
          NAME: ${{ steps.selection.outputs.tree }}
          FILES: ${{ steps.selection.outputs.files }}
          FORCED: ${{ steps.selection.outputs.forced_by }}
        run: 'echo "full suite: $([ "$FULL" = true ] && echo yes || echo no), tree ${NAME#green-tree-}" >> "$GITHUB_STEP_SUMMARY" && INODES=$(df --output=ipcent /tmp | tail -n 1 | tr -dc 0-9) && uv run jbus ci --notice full="$FULL" tree="${NAME#green-tree-}" ${FILES:+selection="$FILES"} ${FORCED:+reason="$FORCED"} ${INODES:+tmp_inode_pct="$INODES"}'
  # The check the ruleset requires, and jmerge's REQUIRED, so its name stays `check`. It runs
  # whatever the parts did, and passes only when `reuse`, `lint` and all eight parts passed: a
  # job that failed, was cancelled or never ran fails it, where a skipped required check would
  # count as passed. On a push to main it is main's check: there `lint` is skipped, since the
  # pull request's lint passed on the same files, and so is the guard of the added lines.
  check:
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
    needs: [reuse, lint, check-shard]
    runs-on: ubuntu-24.04
    # The guard of the added lines runs here, and a line no part ran in a test that names its
    # module runs those tests again before it is a fault: the guard's own cap is 15 minutes.
    timeout-minutes: 20
    steps:
      # On a reuse the parts run no test, and it passes on the pass it reuses, whatever they
      # did. The `reuse` job, which runs the selection and the trailer check, and `lint` passed
      # in either case.
      - name: every part passed
        env:
          PARTS: ${{ needs.check-shard.result }}
          LINT: ${{ needs.lint.result }}
          REUSE: ${{ needs.reuse.result }}
          REUSED: ${{ needs.reuse.outputs.reused }}
          EVENT: ${{ github.event_name }}
        run: '[ "$REUSE" = success ] && { [ "$LINT" = success ] || [ "$EVENT $LINT" = "push skipped" ]; } && { [ "$REUSED" = true ] || [ "$PARTS" = success ]; } || { echo "::error::the reuse job ended $REUSE, the lint $LINT, and the parts of the check $PARTS, not success"; exit 1; }'
      # The guard of test_new_lines_run.py, which the parts skip: each line this change adds to a
      # feature's code ran in a test that names its module, read from what the parts recorded
      # (`NEW_LINES_PARTS`, a folder for each part's upload, whose files are named alike), so no
      # test runs again for a line a part ran. It runs once every part
      # passed, and only where the change touches a feature's src/ or scripts/, so any other
      # change pays for the checkout and no more.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.check-shard.result == 'success' && github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: feature code
        id: code
        if: needs.check-shard.result == 'success' && github.event_name == 'pull_request'
        run: 'git diff --quiet HEAD^1 HEAD -- "features/*/src/*.py" "features/*/scripts/*.py" || echo changed=true >> "$GITHUB_OUTPUT"'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.code.outputs.changed == 'true'
        with:
          version: ${{ env.UV_VERSION }}
      - if: steps.code.outputs.changed == 'true'
        run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.code.outputs.changed == 'true'
        continue-on-error: true
        with:
          pattern: new-lines-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/new-lines
      - name: new lines
        if: steps.code.outputs.changed == 'true'
        env:
          NEW_LINES_PARTS: ${{ runner.temp }}/new-lines
          BASE: HEAD^1
        run: uv run pytest -q -p no:cacheprovider features/repo-guards/tests/test_new_lines_run.py -k every_line_this_branch_adds
      # The pass of the two trees, for a later run of them to reuse (`reuse`). A reuse leaves
      # none: the run it reused left one. One that cannot be kept costs that reuse and nothing
      # else.
      - name: checked trees marker
        id: checked
        if: needs.check-shard.result == 'success' && needs.lint.result == 'success' && needs.reuse.result == 'success' && needs.reuse.outputs.name != '' && needs.reuse.outputs.reused != 'true'
        env:
          NAME: ${{ needs.reuse.outputs.name }}
        run: mkdir -p "$RUNNER_TEMP/checked-tree" && touch "$RUNNER_TEMP/checked-tree/$NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.checked.outcome == 'success'
        continue-on-error: true
        with:
          name: ${{ needs.reuse.outputs.name }}
          path: ${{ runner.temp }}/checked-tree/${{ needs.reuse.outputs.name }}
          retention-days: 7
          if-no-files-found: error
      # A lookup of the tests that failed on main that failed adds none of them, so it says so.
      - name: failed on main warning
        if: needs.reuse.outputs.lookup == 'failure'
        run: echo "::warning::the lookup of the tests that failed on main failed, so the check added none of them"
      # As `full` does: a run that ran the whole suite and passed leaves a marker named by the
      # tree, and a fast run leaves none, since a marker says the full suite passed. A later
      # run of the same tree, main's after a squash merge, skips the suite on it. A push to main
      # whose selection was the whole suite leaves one too: its lint is skipped, since its pull
      # request's passed on the same files. A marker that cannot be kept costs that skip and
      # nothing else.
      - name: green tree marker
        id: marker
        if: needs.check-shard.result == 'success' && (needs.lint.result == 'success' || github.event_name == 'push' && needs.lint.result == 'skipped') && needs.reuse.result == 'success' && needs.reuse.outputs.selection == 'all'
        env:
          NAME: ${{ needs.reuse.outputs.tree }}
        run: mkdir -p "$RUNNER_TEMP/green-tree" && touch "$RUNNER_TEMP/green-tree/$NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        if: steps.marker.outcome == 'success'
        continue-on-error: true
        with:
          name: ${{ needs.reuse.outputs.tree }}
          path: ${{ runner.temp }}/green-tree/${{ needs.reuse.outputs.tree }}
          retention-days: 7
          if-no-files-found: error
  # The facts `select` restores, built on main's tree and saved under the same key: a cache
  # saved on a pull request's ref is seen by that pull request only, and one saved on main by
  # every pull request, so a pull request's first run starts from main's facts and parses only
  # the modules it changed. A job of its own, beside the parts, so that it saves within a minute
  # of the push and a failure here never fails `full`. It runs the selector's Python, the
  # runner's python3 as `reuse` does, since the facts are kept under a salt that holds the
  # Python's version.
  select-facts:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/select_tests.facts
          key: select-facts-${{ hashFiles('scripts/select_tests.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: select-facts-${{ hashFiles('scripts/select_tests.py') }}-
      # Only the facts, not a selection: a selection would write its list into the run's summary.
      - name: facts
        run: python3 -c 'import sys; sys.path[0] = "scripts"; import select_tests; select_tests.facts()'
  # The full suite, nightly and by hand, which a release starts for its tag where the tag's tree
  # has no marker. The tests that open a real browser are not in it: browser.yml runs them,
  # nightly and on a release. It runs as four jobs side by side, split by time as the check's
  # eight are, and the job `full` below passes only when all four did. Four, not eight: it is off
  # the merge path, and its jobs share the account's 40 with the pull requests' checks.
  full-shard:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: full ${{ matrix.shard }} of 4
    # GitHub's hosted runner, as the check's. The job took 9 and 15 minutes on two runs of
    # 2026-10-22, the same suite on runners of the same image: 30 leaves room for a slow one,
    # and a hung run still stops.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Outputs that are the same in every part, since every part checks out the same tree and
    # restores TLC's cache before any part saves one. When the parts of a matrix write one
    # output, the last to end wins, so a part's own outcome is never an output: a lookup that
    # failed is a warning in its part. `tlc` and `restored` are the key the parts restored TLC's
    # cache with and the entry they found, for the save in `full`.
    outputs:
      tree: ${{ steps.tree.outputs.name }}
      tlc: ${{ steps.tlc.outputs.cache-primary-key }}
      restored: ${{ steps.tlc.outputs.cache-matched-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A run that ends green leaves a marker named by the tree it checked out, and a run whose
      # tree has one skips the suite: it would test the same files again. The skip is on the
      # steps, and the job's `if` is the event's alone, so a nightly run always reports
      # `full`. A run that cannot ask runs the suite. A marker is a green run's artifact and
      # nothing else: a ref under refs/jstack/green-tree/, which anybody with write could push,
      # skips nothing.
      - name: green tree
        id: tree
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/green_tree.py
      # A lookup that does not work never fails the part, so it says so here.
      - name: green tree lookup warning
        if: steps.tree.outcome == 'failure'
        run: echo "::warning::green-tree, the lookup ended failure, so the suite runs and a later run of this tree may not skip it"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
        if: steps.tree.outputs.marker != 'green'
      - run: uv sync --locked
        if: steps.tree.outputs.marker != 'green'
      # The suite runs the skills' shell blocks under zsh as well as sh, since a crewmate's
      # shell may be zsh, and GitHub's image has no zsh. It ends with `zsh --version`, so a
      # step that installed none fails.
      # The two .debs, kept by ZSH_DEBS, in the folder the zsh step fetches into: a run after
      # the first fetches nothing from Ubuntu's pool, which on 2026-11-09 reset six parts'
      # fetches mid-transfer (curl exit 56, which `--retry` alone does not retry).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.tree.outputs.marker != 'green'
        with:
          path: ${{ runner.temp }}/zsh-debs
          key: zsh-debs-${{ env.ZSH_DEBS }}
      - name: zsh
        if: steps.tree.outputs.marker != 'green'
        run: 'mkdir -p "$RUNNER_TEMP/zsh-debs" && cd "$RUNNER_TEMP/zsh-debs" && set -- $ZSH_DEBS && printf "%s  %s\n" $ZSH_DEBS > ../zsh.sha256 && { sha256sum --status -c ../zsh.sha256 && echo "zsh: the .debs from the cache" || { curl -fsSL --retry 5 --retry-all-errors --remote-name-all "$ZSH_POOL/$2" "$ZSH_POOL/$4" && sha256sum -c ../zsh.sha256; }; } && sudo dpkg -i "$2" "$4" && zsh --version'
      # The pinned tla2tools.jar, where statechart's `cached_jar` looks for it, so a run after
      # the first fetches nothing from GitHub's release download, which answered a part 504
      # (run 42584414866). The key is the version and sha256 tools.py pins, read from it, so the
      # pin stays written in one place and a new one looks for an entry of its own.
      - name: tla2tools pin
        id: tla2tools
        if: steps.tree.outputs.marker != 'green'
        run: 'pin=$(sed -n -e "s/^TLA2TOOLS_VERSION = \"\(.*\)\"$/version=\1/p" -e "s/^TLA2TOOLS_SHA256 = \"\(.*\)\"$/sha256=\1/p" features/skill-library/skills/statechart/scripts/statechart/tools.py) && [ "$(printf "%s\n" "$pin" | wc -l)" -eq 2 ] && printf "%s\n" "$pin" | tee -a "$GITHUB_OUTPUT" || { echo "::error::tools.py pins no TLA2TOOLS_VERSION and TLA2TOOLS_SHA256 this step reads"; exit 1; }'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.tree.outputs.marker != 'green'
        with:
          path: ~/.cache/jstack/tla2tools/${{ steps.tla2tools.outputs.version }}/tla2tools.jar
          key: tla2tools-${{ steps.tla2tools.outputs.version }}-${{ steps.tla2tools.outputs.sha256 }}
      # TLC's kept output, restored as in the check's parts. Main's entries are those a pull
      # request restores, and it restores only the newest, so no part saves one: each part's runs
      # go up as an artifact, and `full` saves them together as one entry. A part's own entry
      # held only the runs it made, and a pull request that restored it ran every other part's
      # scenes cold, at 60 to 271 s each (run 42531437810, 2026-11-08).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tlc
        if: steps.tree.outputs.marker != 'green'
        with:
          path: ~/.cache/jstack/tlc
          key: tlc-${{ hashFiles('features/home/spec/**', 'features/jmerge/spec/**', 'features/skill-library/skills/statechart/scripts/**') }}-
          restore-keys: |
            tlc-${{ hashFiles('features/home/spec/**', 'features/jmerge/spec/**', 'features/skill-library/skills/statechart/scripts/**') }}-
            tlc-
      - name: make check
        id: suite
        if: steps.tree.outputs.marker != 'green'
        run: make check JUNIT="$RUNNER_TEMP/junit.xml" SHARD=${{ matrix.shard }}/4
      # After the suite, passed or failed, as in the check's parts: every run the part holds,
      # restored or its own, named by the attempt, so a rerun of a part adds its own.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: "!cancelled() && steps.suite.outcome != 'skipped'"
        continue-on-error: true
        with:
          name: tlc-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ~/.cache/jstack/tlc
          retention-days: 1
          if-no-files-found: ignore
      # One line on the job's summary for ci.jsonl, after the suite ran, passed or failed: the
      # workers, the CPU quota they were counted from, the suite's wall, the test time summed
      # over every test, the tail (the wall less that sum shared out over the workers: the time
      # the workers were not all busy), the slowest file, and the CPU pressure of the machine
      # and of this runner's cgroup. GitHub's hosted runner sets no CPU quota, so its quota
      # reads `none`.
      - name: suite summary
        if: "!cancelled() && (steps.suite.outcome == 'success' || steps.suite.outcome == 'failure')"
        continue-on-error: true
        env:
          JUNIT: ${{ runner.temp }}/junit.xml
        run: |
          WORKERS=$(make -n check | sed -n 's/.*pytest -n \([0-9]*\) .*/\1/p') python3 - << 'EOF'
          import collections, os, xml.etree.ElementTree as tree

          def first(path):
              try:
                  with open(path) as lines:
                      return lines.readline().strip() or "none"
              except OSError:
                  return "none"

          quota = first(os.environ.get("CPU_MAX", "/sys/fs/cgroup/cpu.max")).split()
          quota = f"{int(quota[0]) / int(quota[1]):g}" if len(quota) == 2 and quota[0] != "max" else "none"
          workers = int(os.environ.get("WORKERS") or 1)
          suite = tree.parse(os.environ["JUNIT"]).getroot()
          suite = suite if suite.tag == "testsuite" else suite.find("testsuite")
          files = collections.Counter()
          for case in suite.iter("testcase"):
              parts = case.get("classname", "").split(".")
              while len(parts) > 1 and parts[-1].startswith("Test"):
                  parts.pop()
              files["/".join(parts) + ".py"] += float(case.get("time") or 0)
          wall, summed = float(suite.get("time")), sum(files.values())
          slowest, seconds = files.most_common(1)[0] if files else ("none", 0.0)
          line = (
              f"suite: {workers} workers, quota {quota}, wall {wall:.1f} s,"
              f" test time {summed:.1f} s, tail {wall - summed / workers:.1f} s,"
              f" slowest {slowest} {seconds:.1f} s,"
              f" host cpu {first(os.environ.get('HOST_PRESSURE', '/proc/pressure/cpu'))},"
              f" cgroup cpu {first(os.environ.get('CGROUP_PRESSURE', '/sys/fs/cgroup/cpu.pressure'))}"
          )
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(line + "\n")
          EOF
      # The part's junit report, each test's seconds on this runner, named by the attempt that
      # ran it, so that a rerun of a part that failed adds its own. `uv run python -m
      # testing.shard` reads main's last green runs' into testing/shard-times.tsv, a part's
      # latest attempt each. A part that failed keeps none.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.suite.outcome == 'success'
        with:
          name: junit-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/junit.xml
          retention-days: 30
          if-no-files-found: error
  # What a nightly or manual run reports, as `check` does for a pull request: it passes only when
  # all four parts passed, and fails on a part that failed, was cancelled or never ran.
  full:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: full-shard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every part passed
        env:
          PARTS: ${{ needs.full-shard.result }}
        run: '[ "$PARTS" = success ] || { echo "::error::the parts of the full run ended $PARTS, not success"; exit 1; }'
      # TLC's runs of every part, passed or failed, in one folder, saved as one entry under the
      # key the parts restored with and a hash of the names it holds, as `tlc kept` does in the
      # check's parts: so the newest entry of main holds every scene main ran on these specs. A
      # run is named by the hash of its inputs, so two parts that hold one run hold the same file.
      # Parts that skipped the suite on a green marker restored nothing, and nothing is saved.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: runs
        if: "!cancelled() && needs.full-shard.outputs.tlc != ''"
        continue-on-error: true
        with:
          pattern: tlc-*
          path: ~/.cache/jstack/tlc
          merge-multiple: true
      - name: tlc kept
        id: kept
        if: "!cancelled() && steps.runs.outcome == 'success'"
        env:
          KEY: ${{ needs.full-shard.outputs.tlc }}
          RESTORED: ${{ needs.full-shard.outputs.restored }}
        run: 'RUNS=$(LC_ALL=C ls "$HOME/.cache/jstack/tlc" 2> /dev/null) || exit 0; NAMES=$(printf "%s\n" "$RUNS" | sha256sum | cut -c1-16); [ -z "$RUNS" ] || [ "$NAMES" = "${RESTORED##*-}" ] || echo "key=$KEY$NAMES" >> "$GITHUB_OUTPUT"'
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: "!cancelled() && steps.kept.outputs.key != ''"
        continue-on-error: true
        with:
          path: ~/.cache/jstack/tlc
          key: ${{ steps.kept.outputs.key }}
      # The lookup of the tests that failed on main, as the check's `reuse` runs it, so that the
      # cache it leaves is main's, which every pull request's run restores and only adds to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/jstack/failed-on-main.json
          key: failed-on-main-2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: failed-on-main-2-
      - name: failed on main
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/select_tests.py --failed-on-main 30 ~/.cache/jstack/failed-on-main.json
      # Only after every part passed: each one ran its share of the suite and passed, or skipped
      # it on a green run's marker of this same tree. A marker that cannot be kept costs the next
      # run of this tree its skip and nothing else.
      - name: green tree marker
        id: marker
        if: needs.full-shard.result == 'success' && needs.full-shard.outputs.tree != ''
        env:
          NAME: ${{ needs.full-shard.outputs.tree }}
        run: mkdir -p "$RUNNER_TEMP/green-tree" && touch "$RUNNER_TEMP/green-tree/$NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        if: steps.marker.outcome == 'success'
        continue-on-error: true
        with:
          name: ${{ needs.full-shard.outputs.tree }}
          path: ${{ runner.temp }}/green-tree/${{ needs.full-shard.outputs.tree }}
          retention-days: 7
          if-no-files-found: error
      # An upload that does not work never fails the run, so it says so here.
      - name: green tree upload warning
        if: steps.upload.outcome == 'failure'
        run: echo "::warning::green-tree, the upload ended failure, so a later run of this tree may not skip the suite"
