name: slot-probe
on:
  push:
    branches: [slot-test-deflake-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.2"
      - run: uv sync --locked
      - run: uv run jgauge test-slot --slots 1 -- uv run bash .github/slot-probe.sh
