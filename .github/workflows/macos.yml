name: macos

# The tests a Mac can break, on macOS on Apple Silicon, on each merge commit into main and on
# each pull request, in minutes: of the files in testing/macos-quick.txt, whose code branches on
# Darwin or that guard a break only a Mac has, the ones the change reaches. Each mac- fix adds
# its regression test file there.
# `scripts/select_tests.py --within` names them, with the rules `make check-fast` selects by,
# but for two: an import reaches a test only from a changed module of the tests or one that
# names Darwin, and the tests that read the whole tree do not count. Both events select with
# `--strict`, a part of that: there a name reaches a test only from Darwin code or the tests too,
# and a feature's paths reach none, so a change to code that runs the same on a Mac starts no Mac
# (the owner's go, 2026-11-04, gap-macos-post-merge). A pull request selects over its merge
# commit and its first parent. Pushes to main share one group, as check.yml's do: one run goes
# on, one waits, and a newer push displaces the waiting one, so a burst of merges is checked by a
# few runs, each over every merge since the last run that ran (`green_tree.py --last-checked`).
# jbus judges a Mac red over several merges as a red with several commits since the last green
# (`jbus.reverts.macos`). The whole `--within` list, and the rest of the suite, is
# macos-nightly's (2026-11-08: "we should only be running the full test suite before releases
# and nightly - not every CI run").
# The job `macos-select`
# runs it on Linux and hands the tests on to the job `macos-part`; where the selection is `all`
# (pyproject.toml, uv.lock, the root conftest.py or the list itself) it hands on the whole list.
# `macos-part` runs them on up to three Macs side by side, each its part of the tests dealt by
# their recorded times (testing/shard.py's `--shard`), and the job `macos`, on Linux, passes
# only when every part did. Where the change reaches no test of the list, `macos-select` says
# so in one line of its summary and both are skipped by their `if:`, so no Mac starts: GitHub runs few macOS jobs at
# once, and with about 30 pull requests open a run waited up to 14.5 minutes for a Mac only to
# skip its tests (the owner's word, 2026-11-03: skip the Mac when the change reaches no Mac
# test). The whole suite on macOS is mac-nightly's (2026-10-24: "changes should stay quick with
# mac bugs being caught during larger regression runs"; and 2026-10-27: run only the Mac tests
# a change can reach).
# It is a workflow of its own and not a job of check.yml: a run of check.yml has no conclusion
# until its last job ends, and main's full job counts a green-tree marker only from a run that
# concluded success (scripts/green_tree.py), so a slow macOS job there would hold up every
# marker. Its run on a push to main is no part of main's check (`jbus.watch._judged` leaves it
# out), so a Mac red never holds a pull request: jbus reverts its one clear culprit or files a
# `macos-red-` row for it. macOS on Apple Silicon is
# supported, so its check is required: the home's required-checks names `macos`, and jmerge
# waits on it. A job skipped by its `if:` passes GitHub's required checks, and jmerge's where
# the rest of its workflow passed (`jmerge.ready.passed`). So `macos` is skipped only for an
# empty selection, or for two trees a passed macos job ran before (`reuse`): after a failed
# `macos-select` its parts run and fail their first step, and so `macos` fails.
# No `paths:` filter: a run it filters out posts no `macos` check, and jmerge waits on that check
# for ever. The selection and the job's `if:` skip the Mac instead.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # To read the marker a passed macos job of the same two trees left: another run's artifact.
  actions: read

# A pull request's newer run cancels its older one. Pushes to main share the group `macos-main`,
# where a running run is never cancelled and only the newest push waits.
concurrency:
  group: macos-${{ github.event_name == 'push' && 'main' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The same uv as check.yml's (testing/tests/test_workflows.py).
  UV_VERSION: "0.13.2"

jobs:
  # The list's tests the change reaches: the output `tests`, one a line, `run`, whether there
  # is one, and `parts`, the parts `macos-part` deals them into: one for each test file, at
  # most three, so a change that reaches one file starts one Mac. The summary line that names them is this job's, since `macos` may not run.
  macos-select:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.reached.outputs.run }}
      parts: ${{ steps.reached.outputs.parts }}
      tests: ${{ steps.reached.outputs.tests }}
      name: ${{ steps.reuse.outputs.name }}
      reused: ${{ steps.reuse.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The merge commit and its first parent, main: the diff the selection reads.
        with:
          fetch-depth: 2
          persist-credentials: false
      # A push's base: the newest commit of main under this one whose push run of macos.yml ran to
      # an end, fetched; git's empty tree where GitHub does not say, so the whole list. A pull
      # request's base is its merge commit's first parent.
      - name: last checked
        id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/green_tree.py --last-checked macos.yml
      # Whether a passed macos job already ran the two trees this run checks, the merge's and its
      # base's, as check.yml's `reuse` asks of the check (`jmerge.reuse`): the pair fixes the
      # tests the selection hands on and the files they run on. On a hit the selection is skipped
      # and so is `macos`, so no Mac starts, and the summary names the run it reuses. The name is
      # `macos-checked-<base tree>-<merge tree>` (`jmerge.green.macos_checked`), so a pair whose
      # trees differ in any way names another marker. Only a successful macos.yml run of this
      # repo, not a fork's, counts. A run again, a push to main, or a lookup that fails, runs the
      # Mac. A push run's marker names its base's tree, main's last checked commit's, and its own.
      - name: reuse
        id: reuse
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.base.outputs.base || 'HEAD^1' }}
        run: |
          PYTHONPATH=features/jmerge/src python3 - << 'EOF'
          import os, subprocess
          from jmerge import green, reuse

          trees = [os.environ["BASE"] + "^{tree}", "HEAD^{tree}"]
          got = subprocess.run(["git", "rev-parse", *trees], capture_output=True, text=True)
          name = green.macos_checked(*got.stdout.split()) if got.returncode == 0 else ""
          if name:
              reused, why, warn = reuse.answer(name, os.environ)
          else:
              reused, why, warn = False, "the merge or its base has no tree here", True
          print(f"{'::warning::' if warn else ''}reuse: {name}: {why}")
          if reused:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write(f"macOS: {name}: {why}, and no Mac starts\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"name={name}\nreused={'true' if reused else 'false'}\n")
          EOF
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.reuse.outputs.reused != 'true'
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
        if: steps.reuse.outputs.reused != 'true'
      - name: reached tests
        id: reached
        if: steps.reuse.outputs.reused != 'true'
        env:
          BASE: ${{ steps.base.outputs.base || 'HEAD^1' }}
        run: |
          reached="$RUNNER_TEMP/macos-reached.txt"
          tests=$(uv run python3 scripts/select_tests.py --within testing/macos-quick.txt --strict "$BASE" HEAD)
          : > "$reached"
          if [ "$tests" = all ]; then
              cp testing/macos-quick.txt "$reached"
              line="macOS: the selection is all, so every test of testing/macos-quick.txt runs"
          elif [ -n "$tests" ]; then
              printf '%s\n' "$tests" > "$reached"
              line="macOS: the change reaches $(grep -c . "$reached") test files of testing/macos-quick.txt:"
          else
              line="macOS: the change reaches no test of testing/macos-quick.txt, so no Mac starts"
          fi
          {
              echo "$line"
              [ "$tests" = all ] || sed 's/.*/- `&`/' "$reached"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # No seq or wc: the tests run this step on a Mac too, where seq ends its list with the
          # separator and wc pads its count.
          case $(grep -c . "$reached" || true) in
          0 | 1) parts=1 ;;
          2) parts=1,2 ;;
          *) parts=1,2,3 ;;
          esac
          {
              if [ -s "$reached" ]; then echo run=true; else echo run=false; fi
              echo "parts=[$parts]"
              echo "tests<<EOF_TESTS"
              cat "$reached"
              echo EOF_TESTS
          } >> "$GITHUB_OUTPUT"
  # A part fails when a test of it fails, and so does `macos`. Only the step that lists the
  # failed tests, in the job's summary and in one warning with the count, carries
  # continue-on-error. The tests' step stops before the job's cap, so a hung run still gets its
  # list. The whole suite took 51 minutes there (run 40108766945); the list is about 1100 tests.
  # Since the check is required, the tests' cap fails it too: it is 22 minutes, twice the
  # slowest whole run of the list on one Mac (423 to 639 s over twelve runs), as the list grows
  # with each mac- fix. The job's 25 leaves setup, about half a minute, and the summary.
  # Parts, because one Mac ran the list's tests in 0.7 to 12.9 minutes, p50 3.3, of which setup
  # is about 25 s: the slowest required check of a pull request. Each part collects the
  # selection, keeps its share (`--shard K/N`, by testing/shard-times.tsv) and runs it on the
  # runner's three cores; a part the deal leaves empty passes.
  macos-part:
    needs: macos-select
    # Not the implicit `success()`: it would skip the job after a failed selection, and a skip
    # passes the required check. A reuse of a passed macos job of the same trees skips it too.
    if: "!cancelled() && needs.macos-select.outputs.run != 'false' && needs.macos-select.outputs.reused != 'true'"
    name: macos ${{ matrix.part }} of ${{ strategy.job-total }}
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      # Every part runs to its end, so a red check names every failing test.
      fail-fast: false
      matrix:
        # A selection that failed gives no `parts`: one part runs, and its first step fails it.
        part: ${{ fromJSON(needs.macos-select.outputs.parts || '[1]') }}
    steps:
      # The tests `macos-select` handed on, one a line in a file pytest reads.
      - name: handed tests
        env:
          SELECTED: ${{ needs.macos-select.result }}
          TESTS: ${{ needs.macos-select.outputs.tests }}
        run: |
          if [ "$SELECTED" != success ] || [ -z "$TESTS" ]; then
              echo "::error::macos-select ended $SELECTED and handed on no test"
              exit 1
          fi
          printf '%s\n' "$TESTS" > "$RUNNER_TEMP/macos-reached.txt"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      # GitHub's macOS image has gh and jq, and zsh is the system's shell. This installs gh or
      # jq where a later image drops one. The suite fakes gitleaks, as it does on Linux. Its only
      # bash is /bin/bash, 3.2, and test_portable_shell reads each block with a bash 5 first.
      - name: tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: >-
          for tool in gh jq; do command -v "$tool" || brew install "$tool"; done &&
          { [ -x "$(brew --prefix)/bin/bash" ] || brew install bash; } && zsh --version
      # pytest reads the arguments of @<file> from that file, one a line. The runner has three
      # cores. No lint: check.yml's job lints on Linux.
      - name: quick tests
        id: suite
        timeout-minutes: 22
        env:
          PART: ${{ matrix.part }}/${{ strategy.job-total }}
        run: >-
          uv run pytest -n 3 --dist worksteal --durations=25 -m "not browser" --shard "$PART"
          --junitxml="$RUNNER_TEMP/junit.xml" @"$RUNNER_TEMP/macos-reached.txt"
      - name: failed tests
        if: "!cancelled() && steps.suite.outcome != 'skipped'"
        continue-on-error: true
        env:
          JUNIT: ${{ runner.temp }}/junit.xml
          SUITE: ${{ steps.suite.outcome }}
        run: |
          python3 - << 'EOF'
          import os, xml.etree.ElementTree as tree

          def named(case):
              parts, classes = (case.get("classname") or "").split("."), []
              while len(parts) > 1 and parts[-1].startswith("Test"):
                  classes.insert(0, parts.pop())
              return "::".join(["/".join(parts) + ".py", *classes, case.get("name") or ""])

          try:
              report = tree.parse(os.environ["JUNIT"]).getroot()
          except (OSError, tree.ParseError):
              failed = []
              line = f"macOS: no test report, the suite step ended {os.environ['SUITE']}"
          else:
              failed = [
                  named(case)
                  for case in report.iter("testcase")
                  if case.find("failure") is not None or case.find("error") is not None
              ]
              line = f"macOS: {len(failed)} tests failed, the suite step ended {os.environ['SUITE']}"
          print(f"::warning::{line}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(line + "\n" + "".join(f"- `{test}`\n" for test in failed))
          EOF
  # The check the ruleset requires, and jmerge's, so its name stays `macos`. It runs where the
  # parts may run, with their `if:`, and passes only when every part passed: a part that failed,
  # was cancelled or never ran fails it. So it is skipped, which passes, only for an empty
  # selection or a reuse, as the parts are.
  macos:
    needs: [macos-select, macos-part]
    if: "!cancelled() && needs.macos-select.outputs.run != 'false' && needs.macos-select.outputs.reused != 'true'"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every part passed
        env:
          PARTS: ${{ needs.macos-part.result }}
        run: '[ "$PARTS" = success ] || { echo "::error::the parts of the macos job ended $PARTS, not success"; exit 1; }'
      # The pass of the two trees, for a later run of them to reuse (`reuse` in `macos-select`):
      # only parts that all passed leave it. One that cannot be kept costs that reuse and nothing
      # else.
      - name: checked trees marker
        id: checked
        if: needs.macos-part.result == 'success' && needs.macos-select.outputs.name != ''
        env:
          NAME: ${{ needs.macos-select.outputs.name }}
        run: mkdir -p "$RUNNER_TEMP/macos-checked" && touch "$RUNNER_TEMP/macos-checked/$NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.checked.outcome == 'success'
        continue-on-error: true
        with:
          name: ${{ needs.macos-select.outputs.name }}
          path: ${{ runner.temp }}/macos-checked/${{ needs.macos-select.outputs.name }}
          retention-days: 7
          if-no-files-found: error
