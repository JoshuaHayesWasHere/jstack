name: pstack-drift

# What changed upstream in pstack since the pin in THIRD_PARTY.md. It reports and never
# fails: the lines go to the job summary, with one warning per path that drifted.
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # The uv every setup-uv step installs: with none setup-uv fetches the latest release on
  # each job. check.yml, browser.yml and pstack-drift.yml name the same one
  # (testing/tests/test_workflows.py).
  UV_VERSION: "0.13.2"

jobs:
  drift:
    # GitHub's hosted runner, as for the check. It took 14 seconds on 2026-10-22.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - name: make pstack-drift
        # jdrift keeps its clone of pstack under the cache directory, which is the runner's
        # temporary directory here and never a home. GitHub's hosted runner is thrown away after
        # the job, so its home would do as well; the line keeps a runner that is kept between
        # jobs, a fork's own included, from growing a clone in a home that outlives the job.
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}
        run: |
          if ! make -s pstack-drift > drift.txt 2> drift.err; then
            echo "::warning::$(grep -m 1 '^jdrift: ' drift.err || echo 'pstack-drift did not run')"
            cat drift.err >> drift.txt
          fi
          {
            echo '```'
            cat drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sed -n -E 's/^(changed|gone|new) /::warning::&/p' drift.txt
