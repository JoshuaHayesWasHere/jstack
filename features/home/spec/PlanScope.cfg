\* module: PlanScope
\* Today's code: a plan entry's close, the scope's retire and the blocker's fixes moved between
\* two homes, with a process that can die between any two writes, and no fault added.
\* TLC checks each INVARIANT in a run of its own, as statechart from-spec and
\* features/home/tests/test_plan_scope_spec.py run it: TypeOK, RetireWhole and FixCountedOnce
\* hold over 685620 distinct states, and so does EntryOnce: a close run again after one cut short
\* finds the section at the end of plan-done.md and only rewrites the plan. Today's code breaks one
\* rule.
\* expect: FixCountedWhereRead
\*   1. Admit: f1 counted in s's blockers.json
\*   2. MoveName: jbus queue move rewrites f1's Home: line to u
\*   3. MoveDies: the move dies before blockers.rehome, so f1's try is in s's ledger while
\*      admit reads u's; the archive's ArchivePlan breaks it the same way, as no step moves
\*      blockers.json
\* The canaries, Fault = "close-twice" and Fault = "move-one-lock", break EntryOnce (along
\* CloseAppend, CloseDies, CloseAppend: the close run again appends a second copy) and
\* FixCountedOnce (a second fix counted in s while the move holds only u's lock is lost).
CONSTANTS
    Fault = "none"
    Cap = 2
SPECIFICATION Spec
\* Each run ends where nothing is left to happen, which is no fault.
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT EntryOnce
INVARIANT RetireWhole
INVARIANT FixCountedOnce
INVARIANT FixCountedWhereRead
