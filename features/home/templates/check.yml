# The check jmerge merges on: GitHub reports the job below as `check` on each pull request.
# /new-home wrote this file from jstack's template. Add a setup step before the run when the
# check command needs a toolchain the runner lacks.
name: check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          <the check command>
