<style>
  @font-face { font-family: "Atkinson Hyperlegible Next"; src: url("/font.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }

  .bk { font-family: var(--mono); font-size: var(--text-sm); color: var(--ink-2); background: none; border: 0; padding: 0; white-space: nowrap; }

  .chip.user { background: var(--due-tint); color: var(--due); }

  .chip.gap { box-shadow: inset 0 0 0 1px var(--due); color: var(--due); border-radius: var(--radius-sm); }

  .gapbox b { color: var(--due); }
  .now { border: 1.5px solid var(--hair); border-left: 6px solid var(--hair); border-radius: var(--radius-lg); padding: var(--space-6) var(--space-8); background: var(--surface); margin-top: var(--space-8); }

  .seg { display: block; width: 100%; height: 37.5px; border-radius: var(--radius-sm); border: 1px solid var(--hair); background: var(--sunk); }

<script>
(function () {
  var KEY = "jbus-view-theme", root = document.documentElement, forced = root.getAttribute("data-theme-hash");
