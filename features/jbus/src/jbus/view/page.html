    if (!st || !st.layers) { st = { layers: at.target ? [{ target: at.target }] : [], back: false }; history.replaceState(st, ""); }
    var wanted = EXPECT; EXPECT = null;
    if (wanted && !given && wanted.map(function (l) { return l.target; }).join("\n") !== st.layers.map(function (l) { return l.target; }).join("\n")) {
      var put = href(at.project, wanted.length ? wanted[wanted.length - 1].target : "");
      st = { layers: wanted, back: false }; history.replaceState(st, "", put); at = parse(put);
    }
    HASH = at.more; PROJECT = at.project; TRIAGE = !!at.triage; LAYERS = st.layers; BACK = !!st.back;
    QUERY = PROJECT ? "?project=" + encodeURIComponent(PROJECT) : "";
    pending = "";
    if (PROJECT !== was) {
      count("route", PROJECT ? "project" : "stack");
      S = null; NOSUCH = ""; turnOf += 1;
      shutDrawer(first); render();
      pending = top();
      if (pending && free(pending)) { pending = ""; openDrawer(top()); }
      poll();
      return;
    }
    render();
    if (!top()) { shutDrawer(first); return; }
    var focus = LAYERS.length < deeper ? before : kept; kept = "";
    if (S || free(top())) openDrawer(top(), focus);
    else pending = top();
  }
  window.addEventListener("hashchange", function () { route(); });
  if (HASH.theme === "light" || HASH.theme === "dark") document.documentElement.setAttribute("data-theme-hash", HASH.theme);
  route();
  setInterval(function () { poll(); }, POLL_MS);
})();
</script>
<script>
(function () {
  var KEY = "jbus-view-theme", root = document.documentElement, forced = root.getAttribute("data-theme-hash");
  function get() { if (forced) return forced; try { return localStorage.getItem(KEY) || "auto"; } catch (e) { return "auto"; } }
  var NEXT = { auto: "light", light: "dark", dark: "auto" }, NAME = { auto: "Auto", light: "Light", dark: "Dark" }, now = "auto";
  function show(v) {
    now = NAME[v] ? v : "auto";
    if (now === "light" || now === "dark") root.setAttribute("data-theme", now); else root.removeAttribute("data-theme");
    var b = document.getElementById("theme");
    b.textContent = NAME[now];
    b.setAttribute("aria-label", "Light or dark: " + now + (now === "auto" ? ", as the browser asks" : "") + ". Tap for " + NEXT[now]);
    b.title = b.getAttribute("aria-label");
  }
  document.addEventListener("click", function (e) {
    if (!e.target.closest || !e.target.closest("#theme")) return;
    var v = NEXT[now];
    forced = null;
    try { localStorage.setItem(KEY, v); } catch (err) {}
    show(v);
  });
  window.addEventListener("storage", function (e) { if (e.key === KEY && !forced) show(e.newValue || "auto"); });
  show(get());
})();
</script>
