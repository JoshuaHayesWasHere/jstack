\* module: OneList
\* expect: AnsweredLeaves
\* The chart's config: one gate, in today's world, as OneList.cfg has it. The alerts and the
\* marks scenes are left out, as their states are too many to draw: OneList.cfg checks them.
\* The gate's rules are about whole behaviors, which the chart does not draw, so stories.md is
\* empty: TLC's traces are in the chart folder's tlc/, which is not committed, and OneList.cfg's
\* comment says what each act breaks.
CONSTANTS
    World = {"by-home"}
    Fault = "none"
    Scenes = {"gates"}
    After = 2
    MaxLines = 2
    MarkBy = "count"
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ReadOnce
PROPERTY AnsweredLeaves
PROPERTY ListIsTrue
