\* module: OneList
\* expect: AnsweredLeaves
\* The chart's config: one gate, in today's world, as OneList.cfg has it. The alerts and the
\* marks scenes are left out, as their states are too many to draw: OneList.cfg checks them.
\* The gate's rules are about whole behaviors, which the chart does not draw: TLC's trace is in
\* the chart folder's stories.md.
CONSTANTS
    World = {"by-home"}
    Fault = "none"
    Scenes = {"gates"}
    After = 2
    MaxLines = 2
    MarkBy = "count"
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ReadOnce
PROPERTY AnsweredLeaves
PROPERTY ListIsTrue
