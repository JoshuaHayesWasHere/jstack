\* module: OneList
\* expect: pass
\* The chart's config: one gate, in today's world, as OneList.cfg has it. The alerts and the
\* marks scenes are left out, as their states are too many to draw: OneList.cfg checks them.
\* A gate asked by the home is piped by the handoff under the key it was asked under, so every
\* rule holds here; Fault = "ask-again", the handoff before st-one-list-home-marks, breaks
\* AnsweredLeaves and ListIsTrue, as test_one_list_spec.py runs it. stories.md is empty: TLC's
\* traces are in the chart folder's tlc/, which is not committed.
CONSTANTS
    World = {"by-home"}
    Fault = "none"
    Scenes = {"gates"}
    After = 2
    MaxLines = 2
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ReadOnce
PROPERTY AnsweredLeaves
PROPERTY ListIsTrue
