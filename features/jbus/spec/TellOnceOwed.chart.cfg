\* module: TellOnce
\* The chart's config: owed.json's ask alone, an ask owed after a limit, with failover's carry-on
\* and a turn that stops on the limit again. TellOnce.chart.cfg and TellOnceOther.chart.cfg draw the other thirteen acts.
CONSTANTS
    Carriers = {"owed"}
    Fault = "none"
    Passes = 2
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT NoTellTwice
INVARIANT NoTellLost
