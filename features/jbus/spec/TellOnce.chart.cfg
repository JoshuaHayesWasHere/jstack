\* module: TellOnce
\* The chart's config: the seven acts that go to a thread through jbus/outbox.py's t3_thread_send,
\* owed.json's ask aside. TellOnceOther.chart.cfg draws the six that do not, TellOnceOwed.chart.cfg
\* the ask, which alone has as many states as the others, and TellOnce.cfg checks all fourteen. The
\* split keeps each chart's overview to ten boxes.
CONSTANTS
    Carriers = {"clock", "held", "heldlift", "word", "expedite", "revert", "reload"}
    Fault = "none"
    Passes = 2
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT NoTellTwice
INVARIANT NoTellLost
