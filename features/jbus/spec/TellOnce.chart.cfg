\* module: TellOnce
\* The chart's config: the twelve acts but owed.json's ask, which TellOnceOwed.chart.cfg draws
\* on its own, since that act alone has as many states as the other twelve. TellOnce.cfg checks
\* all thirteen.
CONSTANTS
    Carriers = {"clock", "held", "blocking", "items", "word", "expedite", "cancelled", "closed", "account", "revert", "twice", "reload"}
    Fault = "none"
    Passes = 2
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT NoTellTwice
INVARIANT NoTellLost
