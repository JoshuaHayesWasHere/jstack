\* module: OneList
\* expect: pass
\* The one list as today's code keeps it, in today's world: a project closes, a hand cuts
\* merge.log, and a gate's Asked by: names the home. No fault is added, and every rule holds.
\*
\* Each act alone, as test_one_list_spec.py runs it, holds its rule: "closes" holds ListIsTrue
\* (jmerge's alert is open, the project closes, and no pass ends the alert, as `jmerge
\* case-control` on disk, but the list leaves out an alert about a closed project); "cuts" holds
\* ReadOnce, since merge-seen names the last line read, so a cut moves no line from unread to
\* read; "by-home" holds AnsweredLeaves and ListIsTrue, since the handoff pipes the home's own
\* gate under the key it was asked under, so jbus asks it nothing again. The canaries put each
\* bug back: Fault = "closed-listed" breaks ListIsTrue where a project closes, Fault =
\* "mark-count" breaks ReadOnce where a hand cuts merge.log, and Fault = "ask-again" breaks
\* AnsweredLeaves and ListIsTrue where a gate is the home's.
CONSTANTS
    World = {"closes", "cuts", "by-home"}
    Fault = "none"
    Scenes = {"alerts", "gates", "marks"}
    After = 2
    MaxLines = 2
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ReadOnce
PROPERTY AnsweredLeaves
PROPERTY ListIsTrue
