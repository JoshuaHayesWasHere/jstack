\* module: MainFix
\* The code of st-main-fix-crash-gaps, with a pass that can die between any two writes and no other
\* fault of the world, watching all three nightlies. TLC: "Model checking completed. No error has
\* been found.", over 329948 distinct states: FiledWhole, RevertKnown, RevertSaid and RefinesMainRed
\* hold. They hold too with World = {"hand"}, {"refuses"} and {"late"}, the worlds TLC broke them in
\* on the code at aa5469d97, whose traces st-model-main-fix kept here, and with World = {"blind"},
\* a pass with no world.
\*
\* Each canary takes one fix of st-main-fix-crash-gaps back, and TLC finds the break it fixed:
\* - Fault = "keep-first" breaks RevertSaid: a pass records the revert in reverts.json and dies
\*   before `run.find`; every later pass reads the revert as its own (`Keep.OPENED`), so
\*   events.jsonl never has its line.
\* - Fault = "no-known", World = {"hand"}, breaks RevertKnown: a pass opens the revert and dies
\*   before its record; a merge or a rerun turns main green, and no pass judges main red again to
\*   find it, so it stays open with no record, which jmerge never merges and `reverts.close` never
\*   closes.
\* - Fault = "brief-first", World = {"refuses"} or {"late"}, breaks FiledWhole: a pass writes main's
\*   or its Mac's fix brief while GitHub does not answer and dies before queue.add, and the next
\*   pass reverts;
\*   or it writes a nightly's brief and dies, and the next pass finds the run stale. Either way the
\*   brief stays in tasks/ with no row.
CONSTANTS
    MaxTip = 3
    World = {}
    Fault = "none"
    Watched = {"browser", "macos", "scheduled"}
SPECIFICATION Spec
VIEW View
INVARIANT TypeOK
INVARIANT FiledWhole
INVARIANT RevertKnown
INVARIANT RevertSaid
PROPERTY RefinesMainRed
