\* module: MainFix
\* Today's code, with a pass that can die between any two writes and no other fault of the world,
\* watching all three nightlies. TLC: "Model checking completed. No error has been found.", over
\* 1244712 distinct states: FiledWhole, RevertKnown and RefinesMainRed hold.
\*
\* What TLC finds past this config, each a finding of the code at aa5469d97 that
\* features/jbus/tests/test_main_fix_spec.py keeps in FINDINGS, with TLC's shortest trace:
\* - RevertSaid, here as it is: the culprit merges and main goes red; a pass opens the revert,
\*   writes its brief, records it in reverts.json and dies before `run.find`; every later pass
\*   reads the revert as its own (`Keep.OPENED`), so events.jsonl never has its line.
\* - RevertKnown, World = {"hand"}: main goes red; a pass opens the revert and dies before its
\*   record; a merge or a rerun turns main green; the next pass judges no red, so nothing asks
\*   GitHub for the revert again, and it stays open with no record, which jmerge never merges and
\*   `reverts.close` never closes.
\* - RevertKnown, World = {"refuses"}: a pass opens the revert and dies; the next pass gets no
\*   answer from GitHub's compare (`Keep.UNANSWERED`) and files a fix row, with the revert open and
\*   not on record until a pass that GitHub answers.
\* - FiledWhole, World = {"refuses"}: GitHub does not answer, so a pass writes main's fix brief
\*   and dies before queue.add; the next pass, answered, opens the revert, so the brief stays in
\*   tasks/ with no row while main is red at that tip.
\* - FiledWhole, World = {"late"}: a pass writes a nightly's brief and dies before queue.add, and
\*   no pass runs for 3 days; the next one skips the run as stale and never writes `seen`, so the
\*   brief has no row and the red run files nothing.
\* The canary, Fault = "no-reopen-check" (`opened` not asking GitHub by branch), breaks
\* RevertKnown here: a pass opens the revert and dies; the next one opens it again, GitHub
\* refuses a second revert of the branch, and the pass files a fix row with the revert unrecorded.
CONSTANTS
    MaxTip = 3
    World = {}
    Fault = "none"
    Watched = {"browser", "macos", "scheduled"}
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT FiledWhole
INVARIANT RevertKnown
PROPERTY RefinesMainRed
