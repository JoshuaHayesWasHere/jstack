\* module: MainFix
\* The chart's config: main and its Mac with a world where GitHub refuses or does not answer a
\* call, and a hand turns a red green, with no nightly, so TLC's graph stays small enough to
\* draw (11175 distinct states). MainFix.cfg checks the nightlies.
\* expect: FiledWhole
\* expect: RevertKnown
\* expect: RevertSaid
CONSTANTS
    MaxTip = 3
    World = {"refuses", "hand"}
    Fault = "none"
    Watched = {}
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT FiledWhole
INVARIANT RevertKnown
INVARIANT RevertSaid
