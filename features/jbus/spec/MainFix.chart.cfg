\* module: MainFix
\* The chart's config: main and its Mac in a world where GitHub answers each call and no hand
\* turns a red green, with no nightly, so the chart, which draws the shortest way to each state
\* between passes, stays small enough to read (329 distinct states). MainFix.cfg checks the
\* nightlies and the worlds "hand", "refuses" and "late". Every rule holds.
CONSTANTS
    MaxTip = 3
    World = {}
    Fault = "none"
    Watched = {}
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT FiledWhole
INVARIANT RevertKnown
INVARIANT RevertSaid
