\* module: TellOnce
\* Today's code, every act of the ledger's TellOnce rows, with a pass that can die between any two writes.
\* TLC does not pass it. Its first trace, at depth 5: stall.twice holds the row (queue.hold), the pass
\* dies before it pages the Chef, and the next pass skips the held row, so the page never goes
\* (NoTellLost), 124 distinct states in. With -continue, over 1676 distinct states, the rules break on
\* seven acts and hold on the other six (held, items, expedite, cancelled, closed, revert):
\*   twice    NoTellLost   queue.hold, then the pass dies before run.gate: no page, ever
\*   clock    NoTellLost   Box.send writes the stall's key, the pass dies before its event line, and
\*                         the next pass finds the key and writes home: the home is never told
\*   owed     NoTellTwice  failover sends the carry-on quoting the ask, the pass dies before
\*                         owed.taken, and the sweep sends the ask again under its own key
\*   blocking NoTellTwice  the POST went, the pass dies (or hears no answer in time) before outbox.json
\*                         drops the body: posted again
\*   word     NoTellTwice  the word went, the pass dies before sent_at, the home's thread changes,
\*                         and the word goes to the new thread too
\*   account  NoTellTwice  questions.park, the pass dies before account.json, main's unrun tip moves,
\*                         and a second question is parked
\*   reload   NoTellTwice  the notice went, the pass dies before its commits are marked, a merge is
\*                         kept, and the next notice's key names both: the first merge is told again
\* features/jbus/tests/test_tell_once_spec.py checks each, and that each canary breaks every act.
CONSTANTS
    Carriers = {"clock", "held", "blocking", "items", "word", "owed", "expedite", "cancelled", "closed", "account", "revert", "twice", "reload"}
    Fault = "none"
    Passes = 2
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT NoTellTwice
INVARIANT NoTellLost
