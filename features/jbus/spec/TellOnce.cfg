\* module: TellOnce
\* The code, every act of the ledger's TellOnce rows, with a pass that can die between any two writes.
\* TLC breaks no rule on any act: over 1496 distinct states, at depth 24, NoTellTwice and NoTellLost
\* hold on all fourteen. Before st-fix-tell-once they broke on seven, each now closed in the code:
\*   twice    NoTellLost   fails.json pins the page's key before queue.hold, and a pass that finds it
\*                         with no held_at pages under it again, held row or not
\*   clock    NoTellLost   Box.send keeps the stall's line with its key in unlogged.json, one write, and
\*                         writes both before it reads sent.json again
\*   owed     NoTellTwice  owed.json pins the carry-on's key on the ask before the carry-on goes, and
\*                         the sweep sends the ask under it, which T3 Code took already
\*   blocking NoTellTwice  each body gets an id of its own when it is queued, which the relay sends on
\*                         once
\*   word     NoTellTwice  word-sends.json pins the thread tried before the send, and a moved home
\*                         gets the word only where that thread does not hold it
\*   account  NoTellTwice  account.json pins the tip before questions.park, and a pass with no number
\*                         parks that tip's question again
\*   reload   NoTellTwice  reload.json pins the thread tried on each merge before the send, and a retry
\*                         names only those merges
\* st-model-upkeep-run found an eighth, which the clock's fix closes with it, since run.find goes
\* through Box.send too:
\*   heldlift NoTellLost   a hold only the user's accept lifts: its finding's line waits with its
\*                         key in unlogged.json, one write, before held.json says woke
\* features/jbus/tests/test_tell_once_spec.py checks it, and that each canary breaks every act;
\* features/jbus/tests/test_tell_once_crash.py kills a pass at each of the seven in the code.
CONSTANTS
    Carriers = {"clock", "held", "heldlift", "blocking", "items", "word", "owed", "expedite", "cancelled", "closed", "account", "revert", "twice", "reload"}
    Fault = "none"
    Passes = 2
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT NoTellTwice
INVARIANT NoTellLost
