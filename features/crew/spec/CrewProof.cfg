\* trace (one action a step, after the initial state):
\* trace: CheckCall RunEnds CheckAnswer WriteResult ProveNone LaunchFirst ReviewerWrites Push Conflict RebaseKeep RebaseRecord RebaseRun CheckCall RunEnds CheckAnswer RebasePush Die
