\* module: MergeRun
\* Today's code with W's wait spell followed (Inside = {"waits"}).
\* expect: WaitKept
\* WaitLoggedOnce holds: `Spells.merged` runs only at the merge, and `open_only` drops the spell
\* of a merged W without logging it; Fault = "log-on-sweep" logs that spell and breaks it, since
\* the line is appended before the spell is dropped. On one worker TLC finds WaitKept broken in 7 states, after 106
\* distinct states: the tick's run merges W on GitHub and dies before `Spells.merged` appends its
\* line, and `open_only` then drops its spell.
CONSTANTS
    MaxRuns = 1
    MaxTicks = 2
    Fault = "judge-first"
    Inside = {"waits"}
    ReplyLost = TRUE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT WaitLoggedOnce
INVARIANT WaitKept
