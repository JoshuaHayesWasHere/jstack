\* module: MergeRun
\* The chart's config: today's code, one run of the pass's and its record, with no tick, whose busy
\* runs change no story, and every rule of the record. Each bug's shortest story needs one run; a
\* second run's process that removes the first's stamp is MergeRun.cfg's, which the test checks.
\* With two runs TLC printed 2.27M lines of states that break DeathTold and failed inside itself.
\* expect: RunHeard
\* expect: NoFalseNoRecord
\* expect: DeathTold
CONSTANTS
    MaxRuns = 1
    MaxTicks = 0
    Fault = "replace-first"
    Inside = {}
    ReplyLost = TRUE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT RunHeard
INVARIANT StreakOnce
INVARIANT NoFalseNoRecord
INVARIANT DeathTold
INVARIANT OneRunAtATime
