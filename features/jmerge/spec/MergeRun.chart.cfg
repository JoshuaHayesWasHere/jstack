\* module: MergeRun
\* The chart's config: today's code, one run of the pass's and its record, with no tick, whose busy
\* runs change no story, and every rule of the record. RunHeard holds: the pass sends a run's
\* lines before it marks the record read. DeathTold and NoFalseNoRecord hold: the pass moves a
\* stale stamp aside before it tells of its run, and a run removes only its own stamp; two runs,
\* where one run's process meets the next run's stamp, are MergeRun.cfg's, which the test checks.
\* Fault = "replace-first" breaks RunHeard, and Fault = "unlink-first" breaks the other two.
CONSTANTS
    MaxRuns = 1
    MaxTicks = 0
    Fault = "judge-first"
    Inside = {}
    ReplyLost = TRUE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT RunHeard
INVARIANT StreakOnce
INVARIANT NoFalseNoRecord
INVARIANT DeathTold
INVARIANT OneRunAtATime
