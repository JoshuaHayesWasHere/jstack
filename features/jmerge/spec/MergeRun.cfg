\* module: MergeRun
\* Today's code (Fault = "judge-first"): the pass's runs of jmerge and their records, with the
\* run lock shared with the tick's runs, and none of jmerge's inside followed (Inside = {}).
\* Every rule holds: on one worker TLC finds no error over 16,941 distinct states. The pass sends
\* a record's lines before it replaces it, and counts the run on the jmerge streak once for its
\* record's `at`, so a pass that dies between the two reads the record again and counts nothing
\* more.
\* Fault = "replace-first", the code before it, breaks RunHeard in 10 states, after 340 distinct
\* states. Its trace, after the first state:
\*   1 PassStarts: no run is going and no stamp stands
\*   2 PassStamps: started by run 1
\*   3 PassSpawns: run 1's process is up
\*   4 TakesGoing: it holds going.lock
\*   5 RunsJmerge: jmerge takes the run lock
\*   6 Stops: jmerge ends
\*   7 Keeps: ran-<at>.json is written
\*   8 PassReads: the next pass replaces ran-<at>.json with read.json
\*   9 PassDies: the pass dies before `_judged`, and run 1's lines are never sent
\* Fault = "unkeyed", the lines first with no key on the streak, breaks StreakOnce: a pass that
\* dies after `_judged` and before the replace counts the run again on the next pass.
CONSTANTS
    MaxRuns = 2
    MaxTicks = 2
    Fault = "judge-first"
    Inside = {}
    ReplyLost = TRUE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT RunHeard
INVARIANT StreakOnce
INVARIANT OneRunAtATime
