\* module: MergeRun
\* Today's code with jmerge's restart of P followed (Inside = {"restart"}): a run of P's that
\* GitHub left queued is restarted by a close and a reopen.
\* expect: RestartReopens
\* On one worker TLC finds RestartReopens broken in 6 states, after 63 distinct states: the
\* tick's run asks the restart, and GitHub takes the close whose reply gh lost (ReplyLost), so the
\* record keeps a refusal that owes no reopen while P is closed, and the next run's `open_only`
\* drops it. With ReplyLost = FALSE it breaks on a stale list: the tick's run closes P, and the
\* pass's run, handed a list read before, finds P listed and marks its reopen `took`. With
\* Fault = "fresh-list" and ReplyLost = FALSE it holds.
CONSTANTS
    MaxRuns = 1
    MaxTicks = 2
    Fault = "judge-first"
    Inside = {"restart"}
    ReplyLost = TRUE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT RestartReopens
