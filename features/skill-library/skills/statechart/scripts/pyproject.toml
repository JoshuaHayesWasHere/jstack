[project]
name = "statechart"
version = "0.1.0"
description = "Draws what an app's user sees as a Mermaid statechart from TLC's state graph of a TLA+ model. A port of pstack's statechart scripts to Python."
license = "MIT"
requires-python = ">=3.12"
# The Java that runs TLC. jdk4py ships a Java runtime as a Python wheel, so `uv run` brings Java
# and nobody installs it by hand. JAVA, when set, takes its place.
dependencies = [
    "jdk4py==25.0.2.1",
]

[project.scripts]
statechart = "statechart.cli:main"
tlc-to-chart = "statechart.tlc_to_chart:main"
chart-to-tla = "statechart.chart_to_tla:main"
compare-charts = "statechart.compare_charts:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["statechart"]
