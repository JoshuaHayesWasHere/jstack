\* module: TestSlot
\* The machine's test slots, their waiters and holders, the slot log, the usage ledger and the
\* pool waits, over every writer and a crash, as today's code takes them (Fault = "today").
\* expect: WokenGetsSlot
\* TLC's verdict on today's code: "Invariant WokenGetsSlot is violated", in the full room, the
\* shortest trace of today's one fault, after 18,126 distinct states on one TLC worker:
\*   1. the full slot is free;
\*   2. Start .. ClaimCount: a desk's `make check` takes the slot, and the crew finds it taken;
\*   3. Die: the desk's run is killed, and the slot is free again;
\*   4. Start .. Register: the desk starts again, the crew registers as a waiter and ends its
\*      turn, and starts again;
\*   5. BusStart, WakeRead: jbus's pass reads the waiters, the crew among them;
\*   6. ClaimLock, Spare, ClaimCount: jbus counts the slot spare outside the waiters lock, and
\*      the desk, which sees no claim yet, takes it;
\*   7. Tell, WakeLock, Wake: jbus sends the wake, and only then records it;
\*   8. ClaimLock, ClaimCount: the woken crew runs again with its claim holding and finds no
\*      slot.
\* The four faults the code has closed each break their own rule in a
\* canary (README.md). Fault = "none", the mode that passes, holds every rule over 672,971
\* distinct states. PidReuse = TRUE lets another process take a dead command's pid:
\* holders.running checks that the pid still has the start time its run recorded, so NoLostHolder
\* holds, and the canary "pid-alone", which checks the pid alone, breaks it.
CONSTANTS
    Fault = "today"
    PidReuse = TRUE
    Rooms = {"full", "short", "ledger", "pool"}
    Mortal = {"crew", "desk", "short", "quick", "bus", "writers", "pool"}
    Chart = FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT WokenGetsSlot
INVARIANT NoLostHolder
INVARIANT EndNotLost
INVARIANT OneCommandPerSlot
INVARIANT LogMatchesFlock
INVARIANT LedgerNoLostUpdate
INVARIANT PoolNoLostWait
