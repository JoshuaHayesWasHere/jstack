\* module: TestSlot
\* The machine's test slots, their waiters and holders, the slot log, the usage ledger and the
\* pool waits, over every writer and a crash, as today's code takes them (Fault = "today").
\* TLC's verdict on today's code: no error, every rule holds, over 1,357,013 distinct states.
\* Today's code is the mode that passes (Fault = "none"): the five faults the code has closed
\* each break their own rule in a canary (TestSlot.md). PidReuse = TRUE lets another process take
\* a dead command's pid: holders.running checks that the pid still has the start time its run
\* recorded, so NoLostHolder holds, and the canary "pid-alone", which checks the pid alone,
\* breaks it.
CONSTANTS
    Fault = "today"
    PidReuse = TRUE
    Rooms = {"full", "short", "ledger", "pool"}
    Mortal = {"crew", "desk", "short", "quick", "bus", "writers", "pool"}
    Chart = FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT WokenGetsSlot
INVARIANT WokenIsTold
INVARIANT NoLostHolder
INVARIANT EndNotLost
INVARIANT OneCommandPerSlot
INVARIANT LogMatchesFlock
INVARIANT LedgerNoLostUpdate
INVARIANT PoolNoLostWait
