\* module: TestSlot
\* The config the chart is drawn from: today's code (Fault = "today") on a state graph small
\* enough to draw. Only the short lane's crew can be killed, and the full room keeps no holders
\* file (Chart = TRUE), which the short room draws. TestSlot.cfg checks the whole machine.
\* expect: WokenGetsSlot
\* expect: EndNotLost
CONSTANTS
    Fault = "today"
    PidReuse = FALSE
    Rooms = {"full", "short", "ledger", "pool"}
    Mortal = {"short"}
    Chart = TRUE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT WokenGetsSlot
INVARIANT NoLostHolder
INVARIANT EndNotLost
INVARIANT OneCommandPerSlot
INVARIANT LogMatchesFlock
INVARIANT LedgerNoLostUpdate
INVARIANT PoolNoLostWait
