\* module: Setup
\* Today's code, all three parts: the install, the role mirror and an expert's webhook.
\* expect: UninstallComplete
\* TLC stops at the first state that breaks a rule. With 1 worker it finds 15 distinct states,
\* and its trace is the first finding of the README:
\*   1. Initial predicate, fresh = FALSE (~/.local/state is there), nothing on disk
\*   2. Begin: an install starts a make_dirs, op = "dir", HOME's lock held
\*   3. NoteMkdir: `_note` makes ~/.local/state/jstack before it writes the record that names
\*      it, disk = {"state"}, created = {}
\* A stop here leaves the folder with no record, and uninstall's sweep, which finds no record,
\* leaves it. On a fresh HOME the same stop leaves ~/.local/state, which no later run records.
\* Each rule alone, in test_setup_spec.py: MirrorKept and MadePathsRecorded hold, and RecordLevelsRecorded, UninstallComplete,
\* OneWebhook and UrlNamesWebhook break.
CONSTANTS
    Fault = "none"
    MaxId = 2
    Parts = {"install", "mirror", "expert"}
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT UninstallComplete
INVARIANT RecordLevelsRecorded
INVARIANT MadePathsRecorded
INVARIANT MirrorKept
INVARIANT OneWebhook
INVARIANT UrlNamesWebhook
